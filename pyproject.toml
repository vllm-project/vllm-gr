[build-system]
requires = [
    "setuptools>=77.0.3,<81.0.0",
    "wheel",
    "setuptools-scm>=8.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-gr"
dynamic = ["version", "dependencies"]
description = "vLLM-based Generative Recommender Inference Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
authors = [
    {name = "vllm-gr Authors"},
]
keywords = ["machine-learning", "recommender-systems", "inference", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Platform runtimes are selected automatically via setup.py + requirements/.
# See docs/install_simplification_plan.md for the installation model.

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout",
    "pytest-cov>=4.0.0",
    "tblib",
    "black",
    "ruff",
    "mypy",
    "psutil",
    "PyYAML>=6.0",
]
# DEPRECATED: use `pip install -e .` — platform deps come from setup.py
# Kept for one transition release so legacy `.[gpu]` installs still receive
# the GPU-only GR dependencies even if setup.py metadata routing is bypassed.
gpu = [
]
# DEPRECATED: use `pip install -e .` — platform deps come from setup.py
npu = []

[project.urls]
Homepage = "https://github.com/JiusiServe/vllm-gr"
Documentation = "https://github.com/JiusiServe/vllm-gr#readme"
Repository = "https://github.com/JiusiServe/vllm-gr.git"
Issues = "https://github.com/JiusiServe/vllm-gr/issues"

[project.entry-points."vllm.general_plugins"]
vllm_gr = "vllm_gr.plugin:register"

[project.scripts]
vllm-gr = "vllm_gr.entrypoints.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_gr*"]

[tool.setuptools.package-data]
"vllm_gr" = ["_version.py", "*.json", "bin/beam-proc", "bin/beam-proc.exe"]

[tool.setuptools_scm]
fallback_version = "0.22.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
timeout = 250

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true

[tool.typos.default.extend-identifiers]
CANN = "CANN"
cann = "cann"
fx_arange = "fx_arange"
