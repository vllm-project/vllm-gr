[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-gr"
version = "0.3.0"
description = "vLLM-based Generative Recommender Inference Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "vllm-GR Authors"},
]
keywords = ["machine-learning", "recommender-systems", "inference", "vllm", "hstu", "dlrm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Shared dependencies only. Platform runtimes are selected via extras.
dependencies = [
    "msgspec",
    "pandas>=3.0.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
# LMCache integration
lmcache = [
    "lmcache==0.4.1",
]
# SafeTensors for model loading
safetensors = [
    "safetensors>=0.4.5",
]
# GPU runtime for the current GR mainline
gpu = [
    "torch==2.9.1",
    "numpy==2.2.6",
    "opencv-python-headless>=4.13.0",
    "vllm==0.14.1",
    "torchrec==1.4.0",
    "fbgemm-gpu==1.4.0",
]
# NPU runtime for the GR repo itself.
npu = [
    "opencv-python-headless>=4.13.0",
    "vllm==0.14.1",
    "fbgemm-gpu-cpu==1.4.0",
]
# Serving (future extension)
serving = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.12.0",
]
# Full GPU installation
all-gpu = [
    "torch==2.9.1",
    "numpy==2.2.6",
    "opencv-python-headless>=4.13.0",
    "vllm==0.14.1",
    "torchrec==1.4.0",
    "fbgemm-gpu==1.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "safetensors>=0.4.5",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.12.0",
]
# Full NPU installation
all-npu = [
    "opencv-python-headless>=4.13.0",
    "vllm==0.14.1",
    "fbgemm-gpu-cpu==1.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "safetensors>=0.4.5",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.12.0",
]
# Backward-compatible alias. Prefer all-gpu / all-npu in new docs.
all = [
    "torch==2.9.1",
    "numpy==2.2.6",
    "opencv-python-headless>=4.13.0",
    "vllm==0.14.1",
    "torchrec==1.4.0",
    "fbgemm-gpu==1.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "safetensors>=0.4.5",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/your-org/vllm-GR"
Documentation = "https://github.com/your-org/vllm-GR#readme"
Repository = "https://github.com/your-org/vllm-GR.git"
Issues = "https://github.com/your-org/vllm-GR/issues"

[project.entry-points."vllm.general_plugins"]
vllm_gr = "vllm_gr.plugin:register"

[project.scripts]
vllm-gr = "vllm_gr.entrypoints.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_gr*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
