exclude: ^vllm_gr/entrypoints/grpc/generated/
default_install_hook_types:
  - pre-commit
  - commit-msg
default_language_version:
  # Resolved from active `python3` in the venv (3.11, 3.12, or 3.13; see check-python-version).
  python: python3
default_stages:
  - pre-commit # Run locally
  - manual # Run in CI
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: check-python-version
        name: Check Python version (3.11, 3.12, or 3.13)
        entry: python tools/pre_commit/check_python_version.py
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # list of supported hooks: https://pre-commit.com/hooks.html
      - id: check-yaml
        args: ["--unsafe"]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
    - id: isort
      args: ["--profile", "black"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
    - id: ruff-check
      args: [--output-format, github, --fix]
    - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.43.5
    hooks:
    - id: typos
      args: [--force-exclude]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.2
    hooks:
    - id: clang-format
      exclude: 'csrc/(moe/topk_softmax_kernels.cu|quantization/gguf/(ggml-common.h|dequantize.cuh|vecdotq.cuh|mmq.cuh|mmvq.cuh))|vllm/third_party/.*'
      types_or: [c++, cuda]
      args: [--style=file, --verbose]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
    - id: markdownlint
      exclude: '.*\.inc\.md'


  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.9
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
        # GitHub supports concurrency.queue, but pinned actionlint does not yet parse it.
        args: [-ignore, 'unexpected key "queue" for "concurrency" section']


  - repo: local
    hooks:
    - id: signoff-commit
      name: Sign-off Commit
      entry: bash
      args:
        - -c
        - |
          if ! grep -q "^Signed-off-by: $(git config user.name) <$(git config user.email)>" "$(git rev-parse --git-path COMMIT_EDITMSG)"; then
            printf "\nSigned-off-by: $(git config user.name) <$(git config user.email)>\n" >> "$(git rev-parse --git-path COMMIT_EDITMSG)"
          fi
      language: system
      verbose: true
      stages: [commit-msg]
  - repo: local
    hooks:
    - id: mypy-3.11 # TODO: Use https://github.com/pre-commit/mirrors-mypy when mypy setup is less awkward
      name: Run mypy for Python 3.11
      entry: python tools/pre_commit/mypy.py 1 "3.11" --skip-cuda-stage
      <<: &mypy_common
        language: python
        types_or: [python, pyi]
        files: ^(vllm_gr/|tools/pre_commit/mypy\.py$)
        require_serial: true
        additional_dependencies: [mypy==2.4.1, regex, types-cachetools, types-setuptools, types-PyYAML, types-requests, types-protobuf, types-torch, pydantic, numpy==2.2.6, msgspec]

    - id: mypy-3.12 # TODO: Use https://github.com/pre-commit/mirrors-mypy when mypy setup is less awkward
      name: Run mypy for Python 3.12
      entry: python tools/pre_commit/mypy.py 1 "3.12" --skip-cuda-stage
      <<: *mypy_common

    - id: mypy-3.13 # TODO: Use https://github.com/pre-commit/mirrors-mypy when mypy setup is less awkward
      name: Run mypy for Python 3.13
      entry: python tools/pre_commit/mypy.py 1 "3.13" --skip-cuda-stage
      <<: *mypy_common

    # Keep tests and the existing CUDA stage boundary on their pinned checker.
    # Let CUDA_STAGE_FILES select the boundary; avoid duplicating its filenames here.
    - id: mypy-tests-3.11
      name: Run mypy for tests and CUDA stage (Python 3.11)
      entry: python tools/pre_commit/mypy.py 1 "3.11"
      <<: &mypy_tests_common
        language: python
        types_or: [python, pyi]
        files: ^(tests/|tools/pre_commit/mypy\.py$|vllm_gr/v1/worker/)
        require_serial: true
        additional_dependencies: [mypy==1.11.1, regex, types-cachetools, types-setuptools, types-PyYAML, types-requests, types-protobuf, types-torch, pydantic]

    - id: mypy-tests-3.12
      name: Run mypy for tests and CUDA stage (Python 3.12)
      entry: python tools/pre_commit/mypy.py 1 "3.12"
      <<: *mypy_tests_common

    - id: mypy-tests-3.13
      name: Run mypy for tests and CUDA stage (Python 3.13)
      entry: python tools/pre_commit/mypy.py 1 "3.13"
      <<: *mypy_tests_common

    - id: shellcheck
      name: Lint shell scripts
      entry: tools/pre_commit/shellcheck.sh
      language: script
      types: [shell]
      require_serial: true

    - id: png-lint
      name: Lint PNG exports from excalidraw
      entry: tools/pre_commit/png-lint.sh
      language: script
      types: [png]

    - id: signoff-commit
      name: Sign-off Commit
      entry: bash
      args:
        - -c
        - |
          if ! grep -q "^Signed-off-by: $(git config user.name) <$(git config user.email)>" "$(git rev-parse --git-path COMMIT_EDITMSG)"; then
          printf "\nSigned-off-by: $(git config user.name) <$(git config user.email)>\n" >> "$(git rev-parse --git-path COMMIT_EDITMSG)"
          fi
      language: system
      verbose: true
      stages: [commit-msg]

    - id: check-spdx-header
      name: Check SPDX headers and attribution policy
      entry: python tools/pre_commit/check_spdx_header.py --all-tracked
      language: python
      additional_dependencies: [packaging==26.3]
      # The script enumerates git ls-files itself, so the global generated/
      # exclude and the staged-file list do not decide what gets checked.
      always_run: true
      pass_filenames: false

    - id: check-filenames
      name: Check for spaces in all filenames
      entry: bash
      args:
        - -c
        - 'git ls-files | grep " " && echo "Filenames should not contain spaces!" && exit 1 || exit 0'
      language: system
      always_run: true
      pass_filenames: false

    - id: enforce-import-regex-instead-of-re
      name: Enforce import regex as re
      entry: python tools/pre_commit/enforce_regex_import.py
      language: python
      types: [python]
      pass_filenames: false
      additional_dependencies: [regex]

  # prevent use torch.cuda APIs
    - id: check-torch-cuda-call
      name: "Prevent new 'torch.cuda' APIs call"
      entry: python tools/pre_commit/check_torch_cuda.py
      language: python
      types: [python]
      additional_dependencies: [regex]

    - id: validate-config
      name: Validate configuration has default values and that each field has a docstring
      entry: python tools/pre_commit/validate_config.py
      language: python
      additional_dependencies: [regex]

    - id: check-pickle-imports
      name: Prevent new pickle/cloudpickle imports
      entry: python tools/pre_commit/check_pickle_imports.py
      language: python
      types: [python]
      additional_dependencies: [regex]

    - id: check-boolean-context-manager
      name: Check for boolean ops in with-statements
      entry: python tools/pre_commit/check_boolean_context_manager.py
      language: python
      types: [python]

    - id: check-characters
      name: Check valid characters in files
      entry: python tools/pre_commit/check_english.py
      language: python

    # always_run: the top-level exclude hides generated/ from every hook's file
    # list, so a hand edit there would never trigger a file-scoped check.
    - id: check-grpc-generated
      name: Check gRPC bindings match their .proto sources
      entry: python tools/generate_grpc_proto.py --check
      language: python
      additional_dependencies: [grpcio-tools==1.84.0]
      always_run: true
      pass_filenames: false

    - id: run-tests
      name: Run all tests
      entry: bash tools/pre_commit/run_tests.sh
      language: system
      pass_filenames: false
      verbose: true
