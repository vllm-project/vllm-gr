steps:
  - label: "Unit tests"
    key: unit-tests
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: l4_1
    command: >-
      pytest
      -n 4 --durations=10 -sv
      -m '(l1) and (cpu_test and not gpu_test and not npu_test)' tests

  - label: "Kernels Test"
    key: l2-gpu-kernels
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 35
    mirror_hardwares: l4_1
    env:
      PYTHONPATH: "."
      VLLM_GR_INPROC_TEST_SELECTION: exclude
    command: >-
      pytest -p tools.ci.inproc_test_selection
      --run-slow --durations=10 -sv -m 'l2 and gpu_test'
      tests/kernels

  - label: "Kernels Test (in-process)"
    key: l2-gpu-inproc
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: l4_1
    env:
      PYTHONPATH: "."
      VLLM_GR_INPROC_TEST_SELECTION: include
      VLLM_GR_RUN_MODEL_SMOKE: "1"
      VLLM_ENABLE_V1_MULTIPROCESSING: "0"
    command: >-
      pytest -p tools.ci.inproc_test_selection
      --run-slow --durations=10 -sv -m 'l2 and gpu_test'
      tests/kernels

  - label: "Constraints Test"
    key: l2-gpu-constraints
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: l4_1
    command: >-
      pytest
      --durations=10 -sv -m 'l2 and gpu_test'
      tests/constraints

  - label: "Engine Test"
    key: l2-gpu-engine
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: l4_1
    command: >-
      pytest
      --durations=10 -sv -m 'l2 and gpu_test'
      tests/engine

  - label: "Ops Test"
    key: l2-gpu-ops
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: l4_1
    command: >-
      pytest
      --durations=10 -sv -m 'l2 and gpu_test'
      tests/ops

  - label: "V1 Attention Test"
    key: l2-gpu-v1-attention
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: l4_1
    command: >-
      pytest
      --durations=10 -sv -m 'l2 and gpu_test'
      tests/v1/attention

  - label: "V1 Beam Test"
    key: l2-gpu-v1-beam
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: l4_1
    command: >-
      pytest
      --durations=10 -sv -m 'l2 and gpu_test'
      tests/v1/beam

  - label: "Sidecar Test"
    key: l2-gpu-sidecar
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: l4_1
    command: >-
      pytest
      --durations=10 -sv -m 'l2 and gpu_test'
      tests/sidecar

  - label: "System Test"
    key: l2-gpu-system
    depends_on: upload-ready-pipeline
    timeout_in_minutes: 30
    mirror_hardwares: l4_1
    command: >-
      pytest
      --run-slow --durations=10 -sv -m 'l2 and gpu_test'
      tests/e2e

  # Enabled once an AMD agent serves the amd-w7900 queue: set
  # VLLM_GR_ROCM_CI=1 in the pipeline environment.
  - label: "ROCm Test (W7900)"
    key: rocm-w7900
    depends_on: upload-ready-pipeline
    if: build.env("VLLM_GR_ROCM_CI") == "1"
    soft_fail: true
    timeout_in_minutes: 60
    mirror_hardwares: amd_w7900_1
    artifact_paths: "ci-output/rocm/**/*.log"
    command: bash .buildkite/common/scripts/run-rocm-ci.sh
