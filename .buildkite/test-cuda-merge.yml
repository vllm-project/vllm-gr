# Sweep the suite so new directories and CPU integration tests cannot be omitted.
steps:
  - label: "CPU L1/L3 tests"
    key: merge-unit-tests
    depends_on: upload-merge-pipeline
    timeout_in_minutes: 45
    mirror_hardwares: l4_1
    command: >-
      pytest -n 4 --run-slow --strict-test-levels --durations=10 -sv
      -m '(l1 or l3) and (cpu_test and not gpu_test and not npu_test)' tests

  - label: "CUDA L3 tests"
    key: merge-cuda-tests
    depends_on: upload-merge-pipeline
    timeout_in_minutes: 180
    mirror_hardwares: l4_1
    env:
      VLLM_GR_TARGET_DEVICE: cuda
      VLLM_GR_EXCLUDE_CPU_TESTS: "1"
      VLLM_GR_EXCLUDE_MIGRATED_GPU_TESTS: "0"
      VLLM_GR_RUN_MODEL_SMOKE: "1"
      PYTHONPATH: "."
      PYTEST_DEBUG_TEMPROOT: "results/merge-cuda"
    command: >-
      mkdir -p results/merge-cuda &&
      bash tools/ci/run_test_level.sh l3
    artifact_paths: "results/merge-cuda/**/*.json"
