steps:
  - label: "Build CUDA CI image"
    key: cuda-image-build
    agents:
      queue: medium_cpu_queue_premerge
    command: bash .buildkite/common/scripts/build-ci-image.sh

  - label: "Build NPU CI image"
    key: npu-image-build
    if: >-
      (build.branch == "main" && build.pull_request.id == null) ||
      (build.pull_request.id != null &&
       build.pull_request.base_branch == "main" &&
       build.pull_request.draft == false &&
       (build.pull_request.labels includes "ready" ||
        build.pull_request.labels includes "merge-test" ||
        build.pull_request.labels includes "nightly-test"))
    agents:
      queue: medium_cpu_queue_premerge
    command: bash .buildkite/common/scripts/build-ci-image.sh npu

  - label: "Upload CUDA ready pipeline"
    key: upload-ready-pipeline
    if: &ready_condition >-
      build.pull_request.id != null &&
      build.pull_request.base_branch == "main" &&
      build.pull_request.draft == false &&
      build.pull_request.labels includes "ready"
    depends_on: cuda-image-build
    agents:
      queue: medium_cpu_queue_premerge
    command: python3 .buildkite/common/scripts/upload_pipeline.py --upload .buildkite/test-cuda-ready.yml

  - label: "Upload CUDA merge pipeline"
    key: upload-merge-pipeline
    if: &merge_condition >-
      (build.branch == "main" && build.pull_request.id == null) ||
      (build.pull_request.id != null &&
       build.pull_request.base_branch == "main" &&
       build.pull_request.draft == false &&
       build.pull_request.labels includes "merge-test")
    depends_on: cuda-image-build
    agents:
      queue: medium_cpu_queue_premerge
    command: python3 .buildkite/common/scripts/upload_pipeline.py --upload .buildkite/test-cuda-merge.yml

  - label: "Upload NPU ready pipeline"
    key: upload-npu-ready-pipeline
    if: *ready_condition
    depends_on: npu-image-build
    agents:
      queue: medium_cpu_queue_premerge
    command: python3 .buildkite/common/scripts/upload_pipeline.py --upload .buildkite/test-npu-ready.yml

  - label: "Upload NPU merge pipeline"
    key: upload-npu-merge-pipeline
    if: *merge_condition
    depends_on: npu-image-build
    agents:
      queue: medium_cpu_queue_premerge
    command: python3 .buildkite/common/scripts/upload_pipeline.py --upload .buildkite/test-npu-merge.yml

  - label: "Upload CUDA nightly pipeline"
    key: upload-cuda-nightly-pipeline
    if: &nightly_condition >-
      (build.branch == "main" && build.pull_request.id == null &&
       build.env("NIGHTLY") == "1") ||
      (build.pull_request.id != null &&
       build.pull_request.base_branch == "main" &&
       build.pull_request.draft == false &&
       build.pull_request.labels includes "nightly-test")
    depends_on: cuda-image-build
    agents:
      queue: medium_cpu_queue_premerge
    command: python3 .buildkite/common/scripts/upload_pipeline.py --upload .buildkite/test-cuda-nightly.yml

  - label: "Upload NPU nightly pipeline"
    key: upload-npu-nightly-pipeline
    if: *nightly_condition
    depends_on: npu-image-build
    agents:
      queue: medium_cpu_queue_premerge
    command: python3 .buildkite/common/scripts/upload_pipeline.py --upload .buildkite/test-npu-nightly.yml
