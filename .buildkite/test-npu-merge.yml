steps:
  - label: "NPU E2E Test"
    key: l3-npu-e2e
    depends_on: upload-npu-merge-pipeline
    timeout_in_minutes: 90
    mirror_hardwares: a2b3_npu_1
    command: >-
      pytest
      --run-slow --strict-test-levels --durations=10 -sv -m 'l3 and npu_test'
      tests/e2e
