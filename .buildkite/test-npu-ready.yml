# Select by level and platform across every test directory.
steps:
  - label: "NPU L1/L2 tests"
    key: ready-npu-tests
    depends_on: upload-npu-ready-pipeline
    timeout_in_minutes: 180
    mirror_hardwares: a2b3_npu_1
    env:
      VLLM_GR_TARGET_DEVICE: npu
      VLLM_GR_EXCLUDE_CPU_TESTS: "1"
      VLLM_GR_EXCLUDE_MIGRATED_NPU_TESTS: "0"
    command: bash tools/ci/run_test_level.sh pr
