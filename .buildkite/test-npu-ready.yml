steps:
  - label: "NPU Contract Test"
    key: l2-npu-contract
    depends_on: upload-npu-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: a2b3_npu_1
    command: >-
      pytest
      --run-slow --strict-test-levels --durations=10 -sv -m 'l2 and npu_test'
      tests/contract

  - label: "NPU Constraints Test"
    key: l2-npu-constraints
    depends_on: upload-npu-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: a2b3_npu_1
    command: >-
      pytest
      --run-slow --strict-test-levels --durations=10 -sv -m 'l2 and npu_test'
      tests/constraints

  - label: "NPU Integration Test"
    key: l2-npu-integration
    depends_on: upload-npu-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: a2b3_npu_1
    command: >-
      pytest
      --run-slow --strict-test-levels --durations=10 -sv -m 'l2 and npu_test'
      tests/integration

  - label: "NPU Kernels Test"
    key: l2-npu-kernels
    depends_on: upload-npu-ready-pipeline
    timeout_in_minutes: 45
    mirror_hardwares: a2b3_npu_1
    command: >-
      pytest
      --run-slow --strict-test-levels --durations=10 -sv -m 'l2 and npu_test'
      tests/kernels

  - label: "NPU Ops Test"
    key: l2-npu-ops
    depends_on: upload-npu-ready-pipeline
    timeout_in_minutes: 25
    mirror_hardwares: a2b3_npu_1
    command: >-
      pytest
      --run-slow --strict-test-levels --durations=10 -sv -m 'l2 and npu_test'
      tests/ops

  - label: "NPU V1 Test"
    key: l2-npu-v1
    depends_on: upload-npu-ready-pipeline
    timeout_in_minutes: 30
    mirror_hardwares: a2b3_npu_1
    command: >-
      pytest
      --run-slow --strict-test-levels --durations=10 -sv -m 'l2 and npu_test'
      tests/v1
