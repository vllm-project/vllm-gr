# Draft CPU test lane (local only — not pushed yet).
#
# Runs every test classified as CPU-safe (tests/gpu_lanes.py) on a free
# GitHub-hosted runner so the single self-hosted GPU card only executes
# `-m requires_gpu` work.  Before promoting this to a required check:
#   1. validate the install steps actually satisfy the CPU-lane imports
#      (vllm version pin, regex, tokenizer deps);
#   2. compare pass/skip counts against a full run on the card to catch
#      misclassified files (a file that only passes with CUDA belongs in
#      GPU_TEST_FILES);
#   3. keep it non-required until it is green for a few consecutive PRs.
name: CPU Tests

on:
  pull_request:
    branches: [main, decode_graph]
    # `labeled` matters: PRs usually open without labels and receive `ready`
    # afterwards; without it the lane would never start after adding the
    # label, and removing/re-adding `ready` could not rerun it.  Unrelated
    # label edits are kept out of the pending slot by the concurrency group,
    # matching the main workflow's discipline.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, converted_to_draft]
  workflow_dispatch:

concurrency:
  # Mirror the main workflow: unrelated label noise must not cancel or
  # replace a pending real run.
  group: >-
    cpu-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && 'pull_request' || github.event_name }}-${{
    github.event.pull_request.number || github.ref
    }}-${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
    github.event.label.name != 'ready' &&
    format('ignored-{0}', github.run_id) || 'ci' }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       contains(github.event.pull_request.labels.*.name, 'ready') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ready'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VLLM_GR_TARGET_DEVICE: cpu
      # Keeps GPU-lane modules from being imported at collection time
      # (see pytest_ignore_collect in tests/conftest.py); -m alone filters
      # only after import, which would abort collection without the CUDA stack.
      VLLM_GR_TEST_LANE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The vllm wheel drags in the full CUDA 13 stack (~6 GB).  Reclaim the
      # ~25 GB of preinstalled toolchains this lane never uses and skip the
      # pip cache, or the install runs out of disk on the hosted runner
      # ("No space left on device", ~14 GB free on /).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          # vllm is imported by the tests themselves; the CUDA build imports
          # fine on a CPU-only host.  TODO: pin exactly what the GPU CI uses.
          pip install --no-cache-dir vllm==0.30.0
          # pandas is imported directly (test_task_specific_catalog_program)
          # and via benchmarks/open_one_rec/open_one_rec_loader.py, which the
          # async-scheduler fixture chain pulls in.
          pip install --no-cache-dir pytest pytest-asyncio pytest-timeout pytest-xdist regex pandas
          pip install --no-cache-dir -e . --no-deps

      - name: Run CPU test lane
        run: |
          python -m pytest tests -m "not requires_gpu" \
            --run-slow -n auto --durations=10 -q --timeout=250
