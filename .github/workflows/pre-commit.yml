name: Pre-commit and Benchmark

# Keep this metadata protocol in sync with the default-branch queue dispatcher.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '0' &&
      format('ci-meta:v1;run={0};pr={1};base={2};base_sha={3};merge_sha={4}',
             github.run_id, inputs.pr_number, inputs.base_ref, inputs.base_sha, inputs.merge_sha) ||
      github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready') &&
      format('ci-meta:v1;run={0};pr={1};base={2};base_sha={3};merge_sha={4}',
             github.run_id,
             github.event.pull_request.number,
             github.event.pull_request.base.ref,
             github.event.pull_request.base.sha,
             github.sha) ||
      ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
       github.event.label.name != 'ready') && format('ci-ignored:{0}', github.run_id) ||
      format('{0}:{1}@{2}', github.event_name, github.ref_name, github.sha) }}

on:
  pull_request:
    branches: [main, decode_graph]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  push:
    branches: [main, decode_graph]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR snapshot to refresh; 0 checks the selected branch
        required: false
        default: '0'
        type: string
      head_sha:
        description: Immutable PR head
        required: false
        default: ''
        type: string
      base_sha:
        description: Immutable target commit
        required: false
        default: ''
        type: string
      merge_sha:
        description: Immutable merge snapshot
        required: false
        default: ''
        type: string
      base_ref:
        description: Target branch
        required: false
        default: ''
        type: string
      rebuild_pre_commit_cache:
        description: Delete and rebuild this runner's local pre-commit cache
        required: false
        default: false
        type: boolean

concurrency:
  # Unrelated label edits must not cancel queued or running CI for this PR.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) ||
      github.event.pull_request.number || github.ref
    }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ready' && format('ignored-{0}', github.run_id) || 'ci'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: read

env:
  # Use PCI order; the standalone UUID check verifies actual device identity.
  CUDA_DEVICE_ORDER: PCI_BUS_ID

jobs:
  fast-checks:
    name: CPU checks
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      device-required: ${{ steps.plan.outputs.device-required }}
    steps:
      - name: Verify queued snapshot
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          BASE_REF: ${{ inputs.base_ref }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const {PR_NUMBER, HEAD_SHA, BASE_SHA, MERGE_SHA, BASE_REF} = process.env;
            if (!/^(0|[1-9][0-9]*)$/.test(PR_NUMBER) ||
                ![HEAD_SHA, BASE_SHA, MERGE_SHA].every(sha => /^[a-f0-9]{40}$/.test(sha))) {
              throw new Error('Invalid queued commit identity');
            }
            const {data: branch} = await github.rest.repos.getBranch({owner, repo, branch: BASE_REF});
            if (branch.commit.sha !== BASE_SHA) throw new Error('Queued base is obsolete; scheduler will replan');
            if (PR_NUMBER !== '0') {
              const {data: repository} = await github.rest.repos.get({owner, repo});
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: Number(PR_NUMBER)});
              if (!Number.isSafeInteger(repository.id) || pr.head.repo?.id !== repository.id ||
                  pr.base.repo?.id !== repository.id) {
                throw new Error('Fork execution is not allowed by trusted dispatch; use a reviewed repository branch');
              }
              if (pr.state !== 'open' || pr.draft ||
                  (process.env.REQUIRE_READY !== 'false' && !pr.labels.some(label => label.name === 'ready')) ||
                  pr.head.sha !== HEAD_SHA || pr.base.sha !== BASE_SHA || pr.base.ref !== BASE_REF ||
                  pr.merge_commit_sha !== MERGE_SHA) {
                throw new Error('Queued PR snapshot is obsolete; scheduler will replan');
              }
              const {data: merge} = await github.rest.repos.getCommit({owner, repo, ref: MERGE_SHA});
              if (merge.parents.length !== 2 || merge.parents[0].sha !== BASE_SHA || merge.parents[1].sha !== HEAD_SHA) {
                throw new Error('Invalid merge parents');
              }
            } else if (HEAD_SHA !== BASE_SHA || MERGE_SHA !== BASE_SHA) {
              throw new Error('Regression must validate one immutable branch commit');
            }
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != '0'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plan device coverage
        id: plan
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        run: python tools/ci/plan.py
      - name: Install CPU check tools
        run: python -m pip install pre-commit==4.6.2 pytest pytest-timeout PyYAML regex numpy
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: cpu-hooks-${{ runner.os }}-py311-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Reset pre-commit cache
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_pre_commit_cache
        run: pre-commit clean
      - name: Lint and type checks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: CPU contracts and scheduling tests
        run: |
          python tools/ci/run_cpu_tests.py
          node --test tools/ci/tests/*.test.cjs
