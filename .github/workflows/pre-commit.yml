      - name: Check clear device
        if: always() && steps.cuda-mapping.outcome == 'success'
        run: bash ./scripts/check_vllm_on_device.sh

  benchmark-blocking:
    # Ignored label events must not replace the required check with a skipped one.
    name: >-
      ${{ github.event_name == 'pull_request_review' &&
          github.event.pull_request.base.ref != 'main' &&
          github.event.pull_request.base.ref != 'decode_graph' &&
          'Ignored review event' ||
          github.event_name == 'pull_request' &&
          (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name != 'ready' &&
          (github.event.label.name != 'abtest' ||
           github.event.action == 'unlabeled') &&
          'Ignored label event' ||
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
          (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main') &&
          contains(github.event.pull_request.labels.*.name, 'abtest') &&
          !(github.event.action == 'unlabeled' &&
            github.event.label.name == 'ready') &&
          (!contains(github.event.pull_request.labels.*.name, 'ready') ||
           (github.event.action == 'labeled' &&
            github.event.label.name == 'abtest')) &&
          'Beam V1 performance A/B gate' ||
          'Benchmark blocking gate' }}
    needs:
      - resolve-ab-freshness
      - benchmark-policy
      - pre-commit
      - decode-benchmark
      - beam-performance-ab-only
      - pangu-offline
      - pangu-online
    if: >-
      always() &&
      (github.event_name != 'pull_request_review' ||
       github.event.pull_request.base.ref == 'main' ||
       github.event.pull_request.base.ref == 'decode_graph') &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
       (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready' ||
       (github.event.label.name == 'abtest' &&
        github.event.action == 'labeled'))
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate approved benchmark policy
        if: needs.benchmark-policy.result == 'success' && needs.benchmark-policy.outputs.policy-mode == 'candidate'
        uses: actions/github-script@v7
        env:
          POLICY_VERIFY_FINAL: 'true'
          EXPECTED_POLICY_DIGEST: ${{ needs.benchmark-policy.outputs.policy-digest }}
          POLICY_BASE: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const verifyFinal = process.env.POLICY_VERIFY_FINAL === 'true';
            if (verifyFinal && !/^[0-9a-f]{64}$/i.test(process.env.EXPECTED_POLICY_DIGEST || '')) {
              throw new Error('Final verification requires a valid expected policy digest.');
            }
            const ref = process.env.POLICY_REF || process.env.POLICY_BASE;
            if (!/^[0-9a-f]{40}$/i.test(ref)) {
              throw new Error('Policy base must be a full commit SHA.');
            }
            const fetchFile = async (repoPath, commit, optional = false, fileOwner = owner, fileRepo = repo) => {
              try {
                const {data} = await github.rest.repos.getContent({
                  owner: fileOwner, repo: fileRepo, path: repoPath, ref: commit,
                });
                if (!data || Array.isArray(data) || data.type !== 'file' ||
                    data.encoding !== 'base64' || typeof data.content !== 'string' ||
                    !Number.isSafeInteger(data.size) || data.size < 0 || data.size > 1048576) {
                  throw new Error(`${repoPath}@${commit} is not a readable bounded file`);
                }
                const encoded = data.content.replace(/\s/g, '');
                if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
                  throw new Error(`${repoPath}@${commit} has invalid base64 content`);
                }
                const bytes = Buffer.from(encoded, 'base64');
                if (bytes.length !== data.size ||
                    !Buffer.from(bytes.toString('utf8'), 'utf8').equals(bytes)) {
                  throw new Error(`${repoPath}@${commit} has invalid content`);
                }
                return bytes.toString('utf8');
              } catch (error) {
                if (optional && error.status === 404) return null;
                throw error;
              }
            };
            const runtime = await fetchFile('tools/ci/benchmark_policy_runtime.js', ref, true);
            let result;
            if (runtime !== null) {
              const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'policy-runtime-'));
              const runtimePath = path.join(dir, 'benchmark_policy_runtime.js');
              fs.writeFileSync(runtimePath, runtime, {encoding: 'utf8', mode: 0o600});
              const {preparePolicy} = require(runtimePath);
              result = await preparePolicy({github, context, core, tempDir: process.env.RUNNER_TEMP});
            } else {
              // Bootstrap is explicitly inlined in this workflow; no executable
              // candidate file is loaded. Protect changes to this workflow with
              // required trusted checks and code-owner review.
              const policyName = '.github/benchmark-gate.yaml';
              const basePolicy = await fetchFile(policyName, ref);
              const digest = text => crypto.createHash('sha256').update(text).digest('hex');
              let policy = basePolicy;
              let mode = 'base';
              let reviewer = '';
              let sourceRef = ref;
              if (context.payload.pull_request) {
                const pr = context.payload.pull_request;
                const shaPattern = /^[0-9a-f]{40}$/i;
                if (!Number.isSafeInteger(pr.number) || pr.number <= 0 ||
                    !pr.head || !pr.base || !shaPattern.test(pr.head.sha || '') ||
                    !shaPattern.test(pr.base.sha || '') || !shaPattern.test(context.sha || '') ||
                    pr.base.sha !== ref) {
                  throw new Error('Missing pinned PR revision information.');
                }
                const currentPr = async () => {
                  const {data: live} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
                  if (!live || live.state !== 'open' || live.number !== pr.number ||
                      !live.head || !live.base || !live.user || !live.user.login ||
                      !live.head.repo || !live.head.repo.owner || !live.head.repo.owner.login ||
                      !live.head.repo.name || live.head.sha !== pr.head.sha ||
                      live.base.sha !== pr.base.sha || live.merge_commit_sha !== context.sha) {
                    throw new Error('PR head, base or merge changed; rerun the workflow.');
                  }
                  return live;
                };
                const initial = await currentPr();
                const mergePolicy = await fetchFile(policyName, context.sha);
                if (mergePolicy !== basePolicy) {
                  const candidate = await fetchFile(policyName, pr.head.sha);
                  if (candidate !== mergePolicy) {
                    throw new Error('Merged policy differs from the reviewed head policy; update the branch.');
                  }
                  if (!core.summary || typeof core.summary.addRaw !== 'function') {
                    throw new Error('Cannot publish the required policy proposal summary.');
                  }
                  const escape = text => text.slice(0, 65536)
                    .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,
                      c => `\\u${c.charCodeAt(0).toString(16).padStart(4, '0')}`)
                    .replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;',
                      '"': '&quot;', "'": '&#39;'})[c]) +
                    (text.length > 65536 ? '\n[Preview truncated; inspect the full PR diff.]' : '');
                  await core.summary.addRaw(
                    `### Proposed benchmark policy change\n\nBase commit: \`${ref}\`  \n` +
                    `Base policy SHA-256: \`${digest(basePolicy)}\`  \n` +
                    `Candidate commit: \`${pr.head.sha}\`  \n` +
                    `Candidate policy SHA-256: \`${digest(candidate)}\`\n\n` +
                    `#### Base policy\n\n<pre><code>${escape(basePolicy)}</code></pre>\n\n` +
                    `#### Candidate policy\n\n<pre><code>${escape(candidate)}</code></pre>\n\n` +
                    'Review this exact head; a qualified non-author approval is required.\n'
                  ).write();
                  const verifyApproval = async live => {
                    const reviews = [];
                    for (let page = 1; page <= 100; page++) {
                      const {data} = await github.rest.pulls.listReviews({
                        owner, repo, pull_number: pr.number, per_page: 100, page,
                      });
                      if (!Array.isArray(data)) throw new Error('Could not read PR reviews.');
                      reviews.push(...data);
                      if (data.length < 100) break;
                      if (page === 100) throw new Error('Too many reviews to verify safely.');
                    }
                    const latest = new Map();
                    for (const review of reviews) {
                      const user = review && review.user;
                      if (!user || user.type !== 'User' || typeof user.login !== 'string' || !user.login ||
                          user.login.toLowerCase() === live.user.login.toLowerCase() ||
                          !['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state) ||
                          typeof review.submitted_at !== 'string' ||
                          !Number.isFinite(Date.parse(review.submitted_at)) || !Number.isSafeInteger(review.id)) continue;
                      const name = user.login.toLowerCase();
                      const timestamp = Date.parse(review.submitted_at);
                      const prior = latest.get(name);
                      if (!prior || timestamp > prior.timestamp ||
                          (timestamp === prior.timestamp && review.id > prior.review.id)) {
                        latest.set(name, {review, timestamp});
                      }
                    }
                    const eligible = [];
                    for (const [name, entry] of latest) {
                      const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
                        owner, repo, username: entry.review.user.login,
                      });
                      if (!data || typeof data.permission !== 'string') {
                        throw new Error(`Could not verify repository permission for ${name}.`);
                      }
                      if (['write', 'maintain', 'admin'].includes(data.permission)) {
                        eligible.push([name, entry.review]);
                      }
                    }
                    if (eligible.some(([, review]) => review.state === 'CHANGES_REQUESTED')) {
                      throw new Error('An authorized reviewer has an outstanding request for changes.');
                    }
                    const approved = eligible.find(([, review]) => review.state === 'APPROVED' &&
                      typeof review.commit_id === 'string' &&
                      review.commit_id.toLowerCase() === pr.head.sha.toLowerCase());
                    if (!approved) throw new Error('Changed policy requires a current-head approval from a non-author with write access.');
                    return approved[0];
                  };
                  reviewer = await verifyApproval(initial);
                  const live = await currentPr();
                  if (live.user.login.toLowerCase() !== initial.user.login.toLowerCase() ||
                      await verifyApproval(live) !== reviewer) {
                    throw new Error('The candidate policy approval changed during verification.');
                  }
                  policy = candidate;
                  mode = 'candidate';
                  sourceRef = pr.head.sha;
                } else {
                  await currentPr();
                }
              }
              const resolver = await fetchFile('tools/ci/resolve_benchmark_policy.py', ref);
              const normalizer = await fetchFile('tools/ci/normalize_benchmark_policy_env.py', ref);
              const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'policy-bootstrap-'));
              const code = path.join(dir, 'tools', 'ci');
              fs.mkdirSync(code, {recursive: true});
              fs.writeFileSync(path.join(dir, 'tools', '__init__.py'), '');
              fs.writeFileSync(path.join(code, '__init__.py'), '');
              const policyPath = path.join(dir, 'benchmark-gate.yaml');
              const resolverPath = path.join(code, 'resolve_benchmark_policy.py');
              const normalizerPath = path.join(code, 'normalize_benchmark_policy_env.py');
              fs.writeFileSync(policyPath, policy);
              fs.writeFileSync(resolverPath, resolver);
              fs.writeFileSync(normalizerPath, normalizer);
              const policySha256 = digest(policy);
              core.info(`Benchmark policy mode=${mode} source=${sourceRef} base=${ref} sha256=${policySha256}` +
                (reviewer ? ` reviewer=${reviewer}` : ''));
              result = {policyPath, resolverPath, normalizerPath, sourceRef, policyMode: mode, policySha256};
            }
            if (result.policyMode === 'candidate' && !/^[0-9a-f]{64}$/i.test(result.policySha256 || '')) {
              throw new Error('Candidate policy has an invalid digest.');
            }
            if (verifyFinal &&
                (result.policyMode !== 'candidate' ||
                 result.policySha256 !== process.env.EXPECTED_POLICY_DIGEST)) {
              throw new Error('Approved benchmark policy changed during testing.');
            }
            core.setOutput('policy-path', result.policyPath);
            core.setOutput('resolver-path', result.resolverPath);
            core.setOutput('normalizer-path', result.normalizerPath);
            core.setOutput('ref', result.sourceRef);
            core.setOutput('mode', result.policyMode);
            core.setOutput('digest', result.policySha256 || '');

      - name: Require every blocking check to pass
        env:
          ABTEST_ONLY: >-
            ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
                (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main') &&
                contains(github.event.pull_request.labels.*.name, 'abtest') &&
                !(github.event.action == 'unlabeled' &&
                  github.event.label.name == 'ready') &&
                (!contains(github.event.pull_request.labels.*.name, 'ready') ||
                 (github.event.action == 'labeled' &&
                  github.event.label.name == 'abtest')) }}
          ABTEST_RESULT: ${{ needs.beam-performance-ab-only.result }}
          ABTEST_FRESH: ${{ needs.resolve-ab-freshness.outputs.fresh }}
          ABTEST_PASSED: ${{ needs.resolve-ab-freshness.outputs.passed }}
          ABTEST_REQUIRED: >-
            ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
                (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main') &&
                contains(github.event.pull_request.labels.*.name, 'ready') &&
                !(github.event.action == 'labeled' &&
                  github.event.label.name == 'abtest') }}
          POLICY_RESULT: ${{ needs.benchmark-policy.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          DECODE_RESULT: ${{ needs.decode-benchmark.result }}
          PANGU_OFFLINE_RESULT: ${{ needs.pangu-offline.result }}
          PANGU_ONLINE_RESULT: ${{ needs.pangu-online.result }}
        run: |
          if [[ "$ABTEST_ONLY" == true ]]; then
            echo "ABTEST_RESULT=$ABTEST_RESULT"
            if [[ "$ABTEST_RESULT" != success ]]; then
              if [[ "$ABTEST_RESULT" == skipped ]]; then
                echo "::error::A/B has not run for this revision. Remove and re-add the abtest label to start it."
              else
                echo "::error::Beam V1 performance A/B did not pass."
              fi
              exit 1
            fi
            exit 0
          fi
          if [[ "$ABTEST_REQUIRED" == true ]]; then
            if [[ "$ABTEST_FRESH" == true && "$ABTEST_PASSED" != true ]]; then
              echo "::error::The current revision's A/B report failed. Re-add abtest to rerun it."
              exit 1
            fi
            if [[ "$ABTEST_FRESH" != true && "$ABTEST_RESULT" != success ]]; then
              echo "::error::Beam V1 performance A/B is stale or did not pass for this revision."
              exit 1
            fi
          fi
          failed=0
          for result_name in \
            POLICY_RESULT \
            PRE_COMMIT_RESULT \
            DECODE_RESULT \
            PANGU_OFFLINE_RESULT \
            PANGU_ONLINE_RESULT; do
            result="${!result_name}"
            echo "$result_name=$result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$result_name did not pass. Skipped validation is not a pass."
              failed=1
            fi
          done
          exit "$failed"

      - name: Reject cancelled workflow
        if: cancelled()
        run: |
          echo "::error::Cancelled CI cannot satisfy the blocking gate."
          exit 1
