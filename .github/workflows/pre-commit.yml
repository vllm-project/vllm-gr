name: Pre-commit and Benchmark

# Keep this metadata protocol in sync with the default-branch retest router.
run-name: >-
  ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      github.event.pull_request.draft == false &&
      !((github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main') &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'abtest') &&
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready') &&
      format('ci-meta:v1;run={0};pr={1};base={2};base_sha={3};merge_sha={4}',
             github.run_id,
             github.event.pull_request.number,
             github.event.pull_request.base.ref,
             github.event.pull_request.base.sha,
             github.sha) ||
      format('{0}:{1}@{2}', github.event_name, github.ref_name, github.sha) }}

on:
  pull_request:
    branches: [main, decode_graph]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      rebuild_pre_commit_cache:
        description: Delete and rebuild this runner's local pre-commit cache
        required: false
        default: false
        type: boolean

concurrency:
  # Keep A/B-only requests out of the full validation's single pending slot.
  group: >-
    ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && 'pull_request' || github.event_name }}-${{
      github.event.pull_request.number || github.ref
    }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ready' &&
      (github.event.label.name != 'abtest' ||
       github.event.action == 'unlabeled') &&
      format('ignored-{0}', github.run_id) ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'abtest' && 'abtest' || 'ci')
    }}
  cancel-in-progress: >-
    ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
        !(github.event.action == 'labeled' &&
          github.event.label.name == 'abtest') }}

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  # Use PCI order; the standalone UUID check verifies actual device identity.
  CUDA_DEVICE_ORDER: PCI_BUS_ID

jobs:
  resolve-ab-freshness:
    name: Resolve Beam V1 A/B freshness
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      github.event.pull_request.draft == false &&
      (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main') &&
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      !(github.event.action == 'labeled' && github.event.label.name == 'abtest') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready')
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.lookup.outputs.fresh }}
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - name: Find a successful A/B run for this PR revision
        id: lookup
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const defaultTitle = `pull_request:${pr.number}/merge@${context.sha}`;
            let fresh = false;
            let passed = false;
            try {
              for (const event of ['pull_request', 'pull_request_review']) {
                for (let page = 1; page <= 10 && !fresh; page++) {
                  const {data} = await github.rest.actions.listWorkflowRuns({
                    owner, repo, workflow_id: 'pre-commit.yml', event,
                    head_sha: pr.head.sha, per_page: 100, page,
                  });
                  for (const run of data.workflow_runs) {
                    const fullTitle =
                      `ci-meta:v1;run=${run.id};pr=${pr.number};base=${pr.base.ref};` +
                      `base_sha=${pr.base.sha};merge_sha=${context.sha}`;
                    if (run.id === context.runId || run.status !== 'completed' ||
                        !['success', 'failure'].includes(run.conclusion) ||
                        run.head_sha !== pr.head.sha ||
                        (run.display_title !== defaultTitle &&
                         run.display_title !== fullTitle)) {
                      continue;
                    }
                    const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
                      owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
                    });
                    const ab = jobs.jobs.find(job =>
                      job.name === 'Beam V1 performance A/B only' &&
                      ['success', 'failure'].includes(job.conclusion));
                    if (!ab) continue;
                    const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({
                      owner, repo, run_id: run.id, per_page: 100,
                    });
                    fresh = artifacts.artifacts.some(artifact =>
                      artifact.name ===
                        `beam-v1-performance-report-${run.id}-${run.run_attempt}` &&
                      !artifact.expired);
                    passed = fresh && ab.conclusion === 'success';
                    if (fresh) break;
                  }
                  if (data.workflow_runs.length < 100) break;
                }
                if (fresh) break;
              }
            } catch (error) {
              core.warning(`A/B freshness lookup failed; rerunning A/B: ${error.message}`);
              fresh = false;
              passed = false;
            }
            core.setOutput('fresh', fresh ? 'true' : 'false');
            core.setOutput('passed', passed ? 'true' : 'false');
            core.info(fresh
              ? `Current revision's A/B report ${passed ? 'passed' : 'failed'}; reusing it.`
              : 'A/B report is missing or stale; rerunning after regular GPU checks.');

  benchmark-policy:
    name: Resolve benchmark policy
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
      (github.event.pull_request.draft == false &&
       (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'decode_graph') &&
       !((github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main') &&
         github.event.action == 'labeled' &&
         github.event.label.name == 'abtest') &&
       contains(github.event.pull_request.labels.*.name, 'ready') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ready'))
    # Resolve device overrides on the same runner class used by the gates.
    runs-on: self-hosted
    outputs:
      policy-json: ${{ steps.normalize-policy.outputs.policy-json }}
      policy-mode: ${{ steps.benchmark-policy.outputs.mode }}
      policy-digest: ${{ steps.benchmark-policy.outputs.digest }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install policy parser dependency
        working-directory: ${{ runner.temp }}
        run: python -I -m pip install 'PyYAML>=6.0'

      - name: Fetch target branch benchmark policy runtime
        id: benchmark-policy
        uses: actions/github-script@v7
        env:
          POLICY_REF: >-
            ${{ github.event.pull_request.base.sha || github.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const verifyFinal = process.env.POLICY_VERIFY_FINAL === 'true';
            if (verifyFinal && !/^[0-9a-f]{64}$/i.test(process.env.EXPECTED_POLICY_DIGEST || '')) {
              throw new Error('Final verification requires a valid expected policy digest.');
            }
            const ref = process.env.POLICY_REF || process.env.POLICY_BASE;
            if (!/^[0-9a-f]{40}$/i.test(ref)) {
              throw new Error('Policy base must be a full commit SHA.');
            }
            const fetchFile = async (repoPath, commit, optional = false, fileOwner = owner, fileRepo = repo) => {
              try {
                const {data} = await github.rest.repos.getContent({
                  owner: fileOwner, repo: fileRepo, path: repoPath, ref: commit,
                });
                if (!data || Array.isArray(data) || data.type !== 'file' ||
                    data.encoding !== 'base64' || typeof data.content !== 'string' ||
                    !Number.isSafeInteger(data.size) || data.size < 0 || data.size > 1048576) {
                  throw new Error(`${repoPath}@${commit} is not a readable bounded file`);
                }
                const encoded = data.content.replace(/\s/g, '');
                if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
                  throw new Error(`${repoPath}@${commit} has invalid base64 content`);
                }
                const bytes = Buffer.from(encoded, 'base64');
                if (bytes.length !== data.size ||
                    !Buffer.from(bytes.toString('utf8'), 'utf8').equals(bytes)) {
                  throw new Error(`${repoPath}@${commit} has invalid content`);
                }
                return bytes.toString('utf8');
              } catch (error) {
                if (optional && error.status === 404) return null;
                throw error;
              }
            };
            const runtime = await fetchFile('tools/ci/benchmark_policy_runtime.js', ref, true);
            let result;
            if (runtime !== null) {
              const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'policy-runtime-'));
              const runtimePath = path.join(dir, 'benchmark_policy_runtime.js');
              fs.writeFileSync(runtimePath, runtime, {encoding: 'utf8', mode: 0o600});
              const {preparePolicy} = require(runtimePath);
              result = await preparePolicy({github, context, core, tempDir: process.env.RUNNER_TEMP});
            } else {
              // Bootstrap is explicitly inlined in this workflow; no executable
              // candidate file is loaded. Protect changes to this workflow with
              // required trusted checks and code-owner review.
              const policyName = '.github/benchmark-gate.yaml';
              const basePolicy = await fetchFile(policyName, ref);
              const digest = text => crypto.createHash('sha256').update(text).digest('hex');
              let policy = basePolicy;
              let mode = 'base';
              let reviewer = '';
              let sourceRef = ref;
              if (context.payload.pull_request) {
                const pr = context.payload.pull_request;
                const shaPattern = /^[0-9a-f]{40}$/i;
                if (!Number.isSafeInteger(pr.number) || pr.number <= 0 ||
                    !pr.head || !pr.base || !shaPattern.test(pr.head.sha || '') ||
                    !shaPattern.test(pr.base.sha || '') || !shaPattern.test(context.sha || '') ||
                    pr.base.sha !== ref) {
                  throw new Error('Missing pinned PR revision information.');
                }
                const currentPr = async () => {
                  const {data: live} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
                  if (!live || live.state !== 'open' || live.number !== pr.number ||
                      !live.head || !live.base || !live.user || !live.user.login ||
                      !live.head.repo || !live.head.repo.owner || !live.head.repo.owner.login ||
                      !live.head.repo.name || live.head.sha !== pr.head.sha ||
                      live.base.sha !== pr.base.sha || live.merge_commit_sha !== context.sha) {
                    throw new Error('PR head, base or merge changed; rerun the workflow.');
                  }
                  return live;
                };
                const initial = await currentPr();
                const mergePolicy = await fetchFile(policyName, context.sha);
                if (mergePolicy !== basePolicy) {
                  const candidate = await fetchFile(policyName, pr.head.sha);
                  if (candidate !== mergePolicy) {
                    throw new Error('Merged policy differs from the reviewed head policy; update the branch.');
                  }
                  if (!core.summary || typeof core.summary.addRaw !== 'function') {
                    throw new Error('Cannot publish the required policy proposal summary.');
                  }
                  const escape = text => text.slice(0, 65536)
                    .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,
                      c => `\\u${c.charCodeAt(0).toString(16).padStart(4, '0')}`)
                    .replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;',
                      '"': '&quot;', "'": '&#39;'})[c]) +
                    (text.length > 65536 ? '\n[Preview truncated; inspect the full PR diff.]' : '');
                  await core.summary.addRaw(
                    `### Proposed benchmark policy change\n\nBase commit: \`${ref}\`  \n` +
                    `Base policy SHA-256: \`${digest(basePolicy)}\`  \n` +
                    `Candidate commit: \`${pr.head.sha}\`  \n` +
                    `Candidate policy SHA-256: \`${digest(candidate)}\`\n\n` +
                    `#### Base policy\n\n<pre><code>${escape(basePolicy)}</code></pre>\n\n` +
                    `#### Candidate policy\n\n<pre><code>${escape(candidate)}</code></pre>\n\n` +
                    'Review this exact head; a qualified non-author approval is required.\n'
                  ).write();
                  const verifyApproval = async live => {
                    const reviews = [];
                    for (let page = 1; page <= 100; page++) {
                      const {data} = await github.rest.pulls.listReviews({
                        owner, repo, pull_number: pr.number, per_page: 100, page,
                      });
                      if (!Array.isArray(data)) throw new Error('Could not read PR reviews.');
                      reviews.push(...data);
                      if (data.length < 100) break;
                      if (page === 100) throw new Error('Too many reviews to verify safely.');
                    }
                    const latest = new Map();
                    for (const review of reviews) {
                      const user = review && review.user;
                      if (!user || user.type !== 'User' || typeof user.login !== 'string' || !user.login ||
                          user.login.toLowerCase() === live.user.login.toLowerCase() ||
                          !['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state) ||
                          typeof review.submitted_at !== 'string' ||
                          !Number.isFinite(Date.parse(review.submitted_at)) || !Number.isSafeInteger(review.id)) continue;
                      const name = user.login.toLowerCase();
                      const timestamp = Date.parse(review.submitted_at);
                      const prior = latest.get(name);
                      if (!prior || timestamp > prior.timestamp ||
                          (timestamp === prior.timestamp && review.id > prior.review.id)) {
                        latest.set(name, {review, timestamp});
                      }
                    }
                    const eligible = [];
                    for (const [name, entry] of latest) {
                      const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
                        owner, repo, username: entry.review.user.login,
                      });
                      if (!data || typeof data.permission !== 'string') {
                        throw new Error(`Could not verify repository permission for ${name}.`);
                      }
                      if (['write', 'maintain', 'admin'].includes(data.permission)) {
                        eligible.push([name, entry.review]);
                      }
                    }
                    if (eligible.some(([, review]) => review.state === 'CHANGES_REQUESTED')) {
                      throw new Error('An authorized reviewer has an outstanding request for changes.');
                    }
                    const approved = eligible.find(([, review]) => review.state === 'APPROVED' &&
                      typeof review.commit_id === 'string' &&
                      review.commit_id.toLowerCase() === pr.head.sha.toLowerCase());
                    if (!approved) throw new Error('Changed policy requires a current-head approval from a non-author with write access.');
                    return approved[0];
                  };
                  reviewer = await verifyApproval(initial);
                  const live = await currentPr();
                  if (live.user.login.toLowerCase() !== initial.user.login.toLowerCase() ||
                      await verifyApproval(live) !== reviewer) {
                    throw new Error('The candidate policy approval changed during verification.');
                  }
                  policy = candidate;
                  mode = 'candidate';
                  sourceRef = pr.head.sha;
                } else {
                  await currentPr();
                }
              }
              const resolver = await fetchFile('tools/ci/resolve_benchmark_policy.py', ref);
              const normalizer = await fetchFile('tools/ci/normalize_benchmark_policy_env.py', ref);
              const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'policy-bootstrap-'));
              const code = path.join(dir, 'tools', 'ci');
              fs.mkdirSync(code, {recursive: true});
              fs.writeFileSync(path.join(dir, 'tools', '__init__.py'), '');
              fs.writeFileSync(path.join(code, '__init__.py'), '');
              const policyPath = path.join(dir, 'benchmark-gate.yaml');
              const resolverPath = path.join(code, 'resolve_benchmark_policy.py');
              const normalizerPath = path.join(code, 'normalize_benchmark_policy_env.py');
              fs.writeFileSync(policyPath, policy);
              fs.writeFileSync(resolverPath, resolver);
              fs.writeFileSync(normalizerPath, normalizer);
              const policySha256 = digest(policy);
              core.info(`Benchmark policy mode=${mode} source=${sourceRef} base=${ref} sha256=${policySha256}` +
                (reviewer ? ` reviewer=${reviewer}` : ''));
              result = {policyPath, resolverPath, normalizerPath, sourceRef, policyMode: mode, policySha256};
            }
            if (result.policyMode === 'candidate' && !/^[0-9a-f]{64}$/i.test(result.policySha256 || '')) {
              throw new Error('Candidate policy has an invalid digest.');
            }
            if (verifyFinal &&
                (result.policyMode !== 'candidate' ||
                 result.policySha256 !== process.env.EXPECTED_POLICY_DIGEST)) {
              throw new Error('Approved benchmark policy changed during testing.');
            }
            core.setOutput('policy-path', result.policyPath);
            core.setOutput('resolver-path', result.resolverPath);
            core.setOutput('normalizer-path', result.normalizerPath);
            core.setOutput('ref', result.sourceRef);
            core.setOutput('mode', result.policyMode);
            core.setOutput('digest', result.policySha256 || '');

      - name: Resolve base-owned benchmark policy
        working-directory: ${{ runner.temp }}
        env:
          POLICY_FILE: ${{ steps.benchmark-policy.outputs.policy-path }}
          POLICY_REF: ${{ steps.benchmark-policy.outputs.ref }}
          POLICY_RESOLVER: ${{ steps.benchmark-policy.outputs.resolver-path }}
          POLICY_TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.base_ref || github.ref_name }}
        run: |
          device="gpu"
          board_id="unknown"
          if command -v npu-smi > /dev/null 2>&1; then
            device="npu"
            board_id="$(
              python -I -c 'import os, sys; sys.path.insert(0, os.path.join(os.environ.get("ASCEND_TOOLKIT_HOME", "/usr/local/Ascend/ascend-toolkit/latest"), "python/site-packages")); import acl; print(acl.get_soc_name())' \
                2>/dev/null || echo unknown
            )"
          fi

          if [[ "$POLICY_TARGET_BRANCH" == "decode_graph" ||
                "$POLICY_TARGET_BRANCH" == "main" ]]; then
            # Use the migrated accuracy floors and retain the known NPU performance profile.
            if [[ "$device" == "npu" && "$board_id" == "Ascend910_9362" ]]; then
              board_id="decode_graph_Ascend910_9362"
            else
              board_id="decode_graph_${device}"
            fi
          fi

          args=(
            --device "$device"
            --board-id "$board_id"
            --source-ref "$POLICY_REF"
            --github-env "$RUNNER_TEMP/resolved-benchmark-policy.env"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )
          args+=(--policy-file "$POLICY_FILE")
          python -I "$POLICY_RESOLVER" "${args[@]}"

      - name: Normalize v1/v2 policy outputs
        id: normalize-policy
        working-directory: ${{ runner.temp }}
        env:
          POLICY_NORMALIZER: ${{ steps.benchmark-policy.outputs.normalizer-path }}
        run: >-
          python -I "$POLICY_NORMALIZER"
          --env-file "$RUNNER_TEMP/resolved-benchmark-policy.env"
          --github-output "$GITHUB_OUTPUT"

  pre-commit:
    name: Pre-commit
    needs: benchmark-policy
    if: needs.benchmark-policy.result == 'success'
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-gpu
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Resolve candidate runtime
        id: runtime
        env:
          RUNTIME_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
        run: >-
          python tools/ci/resolve_runtime.py resolve
          --device "$RUNTIME_DEVICE"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Cache virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: ${{ steps.runtime.outputs.cache-key }}

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          if [[ "$VLLM_GR_TARGET_DEVICE" == "npu" ]]; then
            # The selected base Python must already contain the vendor runtime.
            uv venv --seed --system-site-packages .venv
          else
            uv venv --seed .venv
          fi

      - name: Set up virtual environment
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          {
            echo "VIRTUAL_ENV=${{ github.workspace }}/.venv"
            echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            echo "PRE_COMMIT_HOME=/data/actions/cache/pre-commit-${RUNNER_NAME}-py311"
          } >> "$GITHUB_ENV"

      - name: Install CUDA base environment
        if: >-
          steps.cache-venv.outputs.cache-hit != 'true' &&
          env.VLLM_GR_TARGET_DEVICE == 'cuda'
        run: uv pip install "$CI_VLLM_REQUIREMENT"

      - name: Refresh editable installation
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install -e ".[dev,grpc]"

      - name: Verify gRPC runtime dependencies
        run: |
          python -c 'from vllm_gr.entrypoints.grpc.generated import vllm_engine_pb2, vllm_engine_pb2_grpc; from vllm_gr.entrypoints.grpc.serving import BeamVllmEngineServicer'

      - name: Verify installed runtime identity
        run: >-
          python tools/ci/resolve_runtime.py verify
          --spec "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --venv "$VIRTUAL_ENV"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/installed.json"
          --cache-root "$RUNNER_TEMP/gr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          --github-env "$GITHUB_ENV"

      - name: Verify CUDA device mapping before cleanup
        id: cuda-mapping
        run: |
          python tools/ci/check_cuda_device_mapping.py --output "$CI_CUDA_MAPPING_FILE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Kill stale process on device
        run: bash ./scripts/kill_vllm_on_device.sh

      - name: Install pre-commit
        run: uv pip install pre-commit==4.6.2

      - name: Reset local pre-commit cache
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.rebuild_pre_commit_cache
        run: pre-commit clean

      - name: Run pre-commit
        run: >-
          pre-commit run
          --show-diff-on-failure
          --color=always
          --all-files

      - name: Check clear device
        if: always() && steps.cuda-mapping.outcome == 'success'
        run: bash ./scripts/check_vllm_on_device.sh

  decode-benchmark:
    name: Decode benchmark
    needs: [benchmark-policy, pre-commit]
    if: >-
      needs.benchmark-policy.result == 'success' &&
      needs.pre-commit.result == 'success'
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-gpu
      queue: max
      cancel-in-progress: false
    env:
      BENCHMARK_POLICY_NAME: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_POLICY_NAME }}
      BENCHMARK_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
      ACCURACY_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ACCURACY_FAILURE_MODE }}
      P99_TTFT_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TTFT_FAILURE_MODE }}
      P99_TPOT_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TPOT_FAILURE_MODE }}
      ONLINE_ELAPSED_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ONLINE_ELAPSED_FAILURE_MODE }}
      OFFLINE_ELAPSED_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).OFFLINE_ELAPSED_FAILURE_MODE }}
      PASS_AT_1_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).PASS_AT_1_THRESHOLD }}
      PASS_AT_32_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).PASS_AT_32_THRESHOLD }}
      RECALL_AT_32_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).RECALL_AT_32_THRESHOLD }}
      ELAPSED_TIME_ONLINE_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ELAPSED_TIME_ONLINE_THRESHOLD }}
      ELAPSED_TIME_OFFLINE_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ELAPSED_TIME_OFFLINE_THRESHOLD }}
      P99_TTFT_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TTFT_THRESHOLD }}
      P99_TPOT_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TPOT_THRESHOLD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Resolve candidate runtime
        id: runtime
        env:
          RUNTIME_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
        run: >-
          python tools/ci/resolve_runtime.py resolve
          --device "$RUNTIME_DEVICE"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Restore virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: ${{ steps.runtime.outputs.cache-key }}

      - name: Require cached virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          echo "The pre-commit environment cache is unexpectedly unavailable." >&2
          exit 1

      - name: Set up virtual environment
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          {
            echo "VIRTUAL_ENV=${{ github.workspace }}/.venv"
            echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          } >> "$GITHUB_ENV"

      - name: Refresh editable installation
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install -e ".[dev]"

      - name: Verify installed runtime identity
        run: >-
          python tools/ci/resolve_runtime.py verify
          --spec "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --venv "$VIRTUAL_ENV"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/installed.json"
          --cache-root "$RUNNER_TEMP/gr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          --github-env "$GITHUB_ENV"

      - name: Verify CUDA device mapping before cleanup
        id: cuda-mapping
        run: |
          python tools/ci/check_cuda_device_mapping.py --output "$CI_CUDA_MAPPING_FILE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Kill stale process on device
        run: bash ./scripts/kill_vllm_on_device.sh

      - name: Cache OpenOneRec dataset
        uses: corca-ai/local-cache@v2
        id: cache-dataset
        with:
          path: OpenOneRec
          base: /data/actions/cache
          key: dataset-openonerec-${{ runner.os }}

      - name: Download OpenOneRec dataset
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "HF_TOKEN is required for the gated OpenOneRec dataset." >&2
            exit 1
          fi
          uv tool install hf
          mkdir -p OpenOneRec
          hf download OpenOneRec/OpenOneRec-RecIF \
            --token "$HF_TOKEN" \
            --local-dir ./OpenOneRec \
            --repo-type=dataset

      - name: Build catalog
        run: |
          mkdir -p generated_data
          python ./benchmarks/open_one_rec/tools/create_task_catalog.py \
            -t video \
            -d ./OpenOneRec/benchmark_data \
            -o generated_data/video_catalog.json
          python ./tools/build_constraint_triples.py \
            --catalog generated_data/video_catalog.json \
            --output generated_data/video_constraint_triples.json \
            --begin "<|sid_begin|>" \
            --end "<|sid_end|>"

      - name: Cache OneRec Recall constraint tables
        if: >-
          ((github.ref_name == 'decode_graph' || github.ref_name == 'main') ||
           (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main')) &&
          env.BENCHMARK_DEVICE == 'gpu'
        uses: corca-ai/local-cache@v2
        id: cache-recall-constraints
        with:
          path: generated_data/recall_constraints
          base: /data/actions/cache
          key: onerec-recall-constraints-v1-${{ runner.os }}-${{ hashFiles('OpenOneRec/benchmark_data/sid2pid.json', 'OpenOneRec/benchmark_data/sid2iid.json') }}

      - name: Build OneRec Recall constraint tables
        if: >-
          ((github.ref_name == 'decode_graph' || github.ref_name == 'main') ||
           (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main')) &&
          env.BENCHMARK_DEVICE == 'gpu' &&
          steps.cache-recall-constraints.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p generated_data/recall_constraints
          for mapping in sid2pid sid2iid; do
            python benchmarks/open_one_rec/tools/convert_catalog.py \
              --dataset-path OpenOneRec/benchmark_data \
              --mapping-file "$mapping.json" \
              --output-path "generated_data/recall_constraints/$mapping-catalog.json"
            python tools/build_constraint_triples.py \
              --catalog "generated_data/recall_constraints/$mapping-catalog.json" \
              --output "generated_data/recall_constraints/${mapping}_triples.json" \
              --begin '<|sid_begin|>' \
              --end '<|sid_end|>'
            rm "generated_data/recall_constraints/$mapping-catalog.json"
          done

      - name: Gate Beam V1 B=4 OneRec Recall on fixed samples
        if: >-
          ((github.ref_name == 'decode_graph' || github.ref_name == 'main') ||
           (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main')) &&
          env.BENCHMARK_DEVICE == 'gpu'
        env:
          V1_RECALL_DATASET_PATH: ${{ github.workspace }}/OpenOneRec/benchmark_data
          V1_RECALL_OUTPUT_DIR: ${{ github.workspace }}/v1_recall_results
          V1_RECALL_BASELINE_FILE: ${{ github.workspace }}/benchmarks/beam_search/v1_recall_b4_baseline.json
        run: bash ./tests/system/run_beam_v1_recall.sh

      - name: Upload Beam V1 Recall measurements
        if: >-
          always() &&
          ((github.ref_name == 'decode_graph' || github.ref_name == 'main') ||
           (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main')) &&
          env.BENCHMARK_DEVICE == 'gpu'
        uses: actions/upload-artifact@v4
        with:
          name: beam-v1-recall-${{ github.run_id }}-${{ github.run_attempt }}
          path: v1_recall_results
          if-no-files-found: warn
          retention-days: 14

      - name: Execute decode benchmark gates
        if: >-
          env.BENCHMARK_DEVICE != 'gpu' ||
          ((github.ref_name != 'decode_graph' && github.ref_name != 'main') &&
           (github.event.pull_request.base.ref != 'decode_graph' &&
            github.event.pull_request.base.ref != 'main'))
        env:
          DATASET_PATH: ${{ github.workspace }}/OpenOneRec/benchmark_data
          CATALOG_PATH: ${{ github.workspace }}/generated_data/video_catalog.json
          TRIPLES_PATH: ${{ github.workspace }}/generated_data/video_constraint_triples.json
        run: ./tests/system/run_benchmark_and_verify.sh

      - name: Check clear device
        if: always() && steps.cuda-mapping.outcome == 'success'
        run: bash ./scripts/check_vllm_on_device.sh

  beam-performance-ab-only:
    name: Beam V1 performance A/B only
    needs: [resolve-ab-freshness, pangu-online]
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      github.event.pull_request.draft == false &&
      (github.event.pull_request.base.ref == 'decode_graph' ||
                 github.event.pull_request.base.ref == 'main') &&
      ((github.event.action == 'labeled' &&
        github.event.label.name == 'abtest') ||
       (contains(github.event.pull_request.labels.*.name, 'ready') &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         github.event.label.name == 'ready') &&
        needs.resolve-ab-freshness.outputs.fresh != 'true'))
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-gpu
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # A/B checks that the event base is an ancestor of the merge's first
          # parent. The base can advance after the event, so retain its history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Require a CUDA runner
        run: nvidia-smi --query-gpu=name --format=csv,noheader

      - name: Resolve candidate runtime
        id: runtime
        run: >-
          python tools/ci/resolve_runtime.py resolve
          --device cuda
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Restore candidate virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: ${{ steps.runtime.outputs.cache-key }}

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv --seed .venv

      - name: Set up virtual environment
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
          echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"

      - name: Install candidate CUDA runtime
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv pip install "$CI_VLLM_REQUIREMENT"

      - name: Refresh editable installation
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install -e ".[dev]"

      - name: Verify candidate runtime identity
        run: >-
          python tools/ci/resolve_runtime.py verify
          --spec "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --venv "$VIRTUAL_ENV"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/installed.json"
          --cache-root "$RUNNER_TEMP/gr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          --github-env "$GITHUB_ENV"

      - name: Verify CUDA device mapping before cleanup
        id: cuda-mapping
        run: |
          python tools/ci/check_cuda_device_mapping.py --output "$CI_CUDA_MAPPING_FILE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Kill stale process on device
        run: bash ./scripts/kill_vllm_on_device.sh

      - name: Cache OpenOneRec dataset
        uses: corca-ai/local-cache@v2
        id: cache-dataset
        with:
          path: OpenOneRec
          base: /data/actions/cache
          key: dataset-openonerec-${{ runner.os }}

      - name: Download OpenOneRec dataset
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "HF_TOKEN is required for the gated OpenOneRec dataset." >&2
            exit 1
          fi
          uv tool install hf
          mkdir -p OpenOneRec
          hf download OpenOneRec/OpenOneRec-RecIF \
            --token "$HF_TOKEN" \
            --local-dir ./OpenOneRec \
            --repo-type=dataset

      - name: Build catalog
        run: |
          mkdir -p generated_data
          python ./benchmarks/open_one_rec/tools/create_task_catalog.py \
            -t video \
            -d ./OpenOneRec/benchmark_data \
            -o generated_data/video_catalog.json
          python ./tools/build_constraint_triples.py \
            --catalog generated_data/video_catalog.json \
            --output generated_data/video_constraint_triples.json \
            --begin "<|sid_begin|>" \
            --end "<|sid_end|>"

      - name: Run Beam V1 performance A/B
        env:
          TRIPLES_PATH: ${{ github.workspace }}/generated_data/video_constraint_triples.json
          V1_PERF_OUTPUT_DIR: ${{ github.workspace }}/v1_performance_results
          V1_PERF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          V1_PERF_CANDIDATE_SHA: ${{ github.sha }}
          V1_PERF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          V1_PERF_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash ./tests/system/run_beam_v1_performance_ab.sh

      - name: Upload Beam V1 performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beam-v1-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: v1_performance_results
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Beam V1 A/B report for PR comment
        if: always() && hashFiles('v1_performance_results/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: beam-v1-performance-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v1_performance_results/context.json
            v1_performance_results/report.json
            v1_performance_results/report.md
          if-no-files-found: error
          retention-days: 14

