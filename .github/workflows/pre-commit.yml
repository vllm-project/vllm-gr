name: Pre-commit and Benchmark

# Keep this metadata protocol in sync with the default-branch retest router.
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !(github.event.pull_request.base.ref == 'decode_graph' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'abtest') &&
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready') &&
      format('ci-meta:v1;run={0};pr={1};base={2};base_sha={3};merge_sha={4}',
             github.run_id,
             github.event.pull_request.number,
             github.event.pull_request.base.ref,
             github.event.pull_request.base.sha,
             github.sha) ||
      format('{0}:{1}@{2}', github.event_name, github.ref_name, github.sha) }}

on:
  pull_request:
    branches: [main, decode_graph]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      rebuild_pre_commit_cache:
        description: Delete and rebuild this runner's local pre-commit cache
        required: false
        default: false
        type: boolean

concurrency:
  # Keep A/B-only requests out of the full validation's single pending slot.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number || github.ref
    }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ready' &&
      (github.event.label.name != 'abtest' ||
       github.event.action == 'unlabeled') &&
      format('ignored-{0}', github.run_id) ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'abtest' && 'abtest' || 'ci')
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        !(github.event.action == 'labeled' &&
          github.event.label.name == 'abtest') }}

permissions:
  actions: read
  contents: read

env:
  # Use PCI order; the standalone UUID check verifies actual device identity.
  CUDA_DEVICE_ORDER: PCI_BUS_ID

jobs:
  resolve-ab-freshness:
    name: Resolve Beam V1 A/B freshness
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'decode_graph' &&
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      !(github.event.action == 'labeled' && github.event.label.name == 'abtest') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready')
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.lookup.outputs.fresh }}
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - name: Find a successful A/B run for this PR revision
        id: lookup
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const defaultTitle = `pull_request:${pr.number}/merge@${context.sha}`;
            let fresh = false;
            let passed = false;
            try {
              for (let page = 1; page <= 10 && !fresh; page++) {
                const {data} = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: 'pre-commit.yml', event: 'pull_request',
                  head_sha: pr.head.sha, per_page: 100, page,
                });
                for (const run of data.workflow_runs) {
                  const fullTitle =
                    `ci-meta:v1;run=${run.id};pr=${pr.number};base=${pr.base.ref};` +
                    `base_sha=${pr.base.sha};merge_sha=${context.sha}`;
                  if (run.id === context.runId || run.status !== 'completed' ||
                      !['success', 'failure'].includes(run.conclusion) ||
                      run.head_sha !== pr.head.sha ||
                      (run.display_title !== defaultTitle &&
                       run.display_title !== fullTitle)) {
                    continue;
                  }
                  const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
                    owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
                  });
                  const ab = jobs.jobs.find(job =>
                    job.name === 'Beam V1 performance A/B only' &&
                    ['success', 'failure'].includes(job.conclusion));
                  if (!ab) continue;
                  const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({
                    owner, repo, run_id: run.id, per_page: 100,
                  });
                  fresh = artifacts.artifacts.some(artifact =>
                    artifact.name ===
                      `beam-v1-performance-report-${run.id}-${run.run_attempt}` &&
                    !artifact.expired);
                  passed = fresh && ab.conclusion === 'success';
                  if (fresh) break;
                }
                if (data.workflow_runs.length < 100) break;
              }
            } catch (error) {
              core.warning(`A/B freshness lookup failed; rerunning A/B: ${error.message}`);
              fresh = false;
              passed = false;
            }
            core.setOutput('fresh', fresh ? 'true' : 'false');
            core.setOutput('passed', passed ? 'true' : 'false');
            core.info(fresh
              ? `Current revision's A/B report ${passed ? 'passed' : 'failed'}; reusing it.`
              : 'A/B report is missing or stale; rerunning after regular GPU checks.');

  benchmark-policy:
    name: Resolve benchmark policy
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !(github.event.pull_request.base.ref == 'decode_graph' &&
         github.event.action == 'labeled' &&
         github.event.label.name == 'abtest') &&
       contains(github.event.pull_request.labels.*.name, 'ready') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ready'))
    # Resolve device overrides on the same runner class used by the gates.
    runs-on: self-hosted
    outputs:
      policy-json: ${{ steps.normalize-policy.outputs.policy-json }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install policy parser dependency
        run: python -m pip install 'PyYAML>=6.0'

      - name: Lint checked-out candidate policy
        run: >-
          python tools/ci/resolve_benchmark_policy.py
          --policy-file .github/benchmark-gate.yaml
          --validate-only

      - name: Fetch target branch benchmark policy runtime
        id: benchmark-policy
        uses: actions/github-script@v7
        env:
          POLICY_REF: >-
            ${{ github.event.pull_request.base.sha || github.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = process.env.POLICY_REF;
            const policyRepoPath = '.github/benchmark-gate.yaml';
            const resolverRepoPath =
              'tools/ci/resolve_benchmark_policy.py';
            const policyPath = path.join(
              process.env.RUNNER_TEMP,
              'benchmark-gate-base.yaml',
            );
            const resolverPath = path.join(
              process.env.RUNNER_TEMP,
              'resolve-benchmark-policy-base.py',
            );

            const fetchFile = async (repoPath) => {
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: repoPath,
                  ref,
                });
                if (Array.isArray(response.data) ||
                    response.data.type !== 'file' ||
                    !response.data.content) {
                  throw new Error(
                    `${repoPath}@${ref} is not a readable file`,
                  );
                }
                return Buffer.from(
                  response.data.content,
                  response.data.encoding,
                ).toString('utf8');
              } catch (error) {
                if (error.status === 404) {
                  return null;
                }
                throw error;
              }
            };

            const policy = await fetchFile(policyRepoPath);
            const resolver = await fetchFile(resolverRepoPath);
            const bootstrap = resolver === null;
            if (bootstrap && context.eventName !== 'pull_request') {
              throw new Error(
                `Required policy resolver ${resolverRepoPath} is missing ` +
                `from ${ref}`,
              );
            }
            if (!bootstrap && policy === null) {
              throw new Error(
                `Required benchmark policy ${policyRepoPath} is missing ` +
                `from ${ref}`,
              );
            }
            if (policy !== null) {
              fs.writeFileSync(policyPath, policy, {encoding: 'utf8'});
            }
            if (resolver !== null) {
              fs.writeFileSync(
                resolverPath,
                resolver,
                {encoding: 'utf8'},
              );
            }

            core.setOutput('bootstrap', String(bootstrap));
            core.setOutput('policy-path', policyPath);
            core.setOutput('ref', ref);
            core.setOutput(
              'resolver-path',
              bootstrap ? resolverRepoPath : resolverPath,
            );

      - name: Resolve base-owned benchmark policy
        env:
          BOOTSTRAP_POLICY: ${{ steps.benchmark-policy.outputs.bootstrap }}
          POLICY_FILE: ${{ steps.benchmark-policy.outputs.policy-path }}
          POLICY_REF: ${{ steps.benchmark-policy.outputs.ref }}
          POLICY_RESOLVER: ${{ steps.benchmark-policy.outputs.resolver-path }}
          POLICY_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          device="gpu"
          board_id="unknown"
          if command -v npu-smi > /dev/null 2>&1; then
            device="npu"
            board_id="$(
              python -c 'import acl; print(acl.get_soc_name())' \
                2>/dev/null || echo unknown
            )"
          fi

          if [[ "$POLICY_TARGET_BRANCH" == "decode_graph" ]]; then
            # Share accuracy floors while retaining the known NPU performance profile.
            if [[ "$device" == "npu" && "$board_id" == "Ascend910_9362" ]]; then
              board_id="decode_graph_Ascend910_9362"
            else
              board_id="decode_graph_${device}"
            fi
          fi

          args=(
            --device "$device"
            --board-id "$board_id"
            --source-ref "$POLICY_REF"
            --github-env "$RUNNER_TEMP/resolved-benchmark-policy.env"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$BOOTSTRAP_POLICY" == "true" ]]; then
            echo "Base resolver is absent; using the strict migration bootstrap."
            args+=(--bootstrap-strict)
          else
            args+=(--policy-file "$POLICY_FILE")
          fi
          python "$POLICY_RESOLVER" "${args[@]}"

      - name: Normalize v1/v2 policy outputs
        id: normalize-policy
        run: >-
          python tools/ci/normalize_benchmark_policy_env.py
          --env-file "$RUNNER_TEMP/resolved-benchmark-policy.env"
          --github-output "$GITHUB_OUTPUT"

  pre-commit:
    name: Pre-commit
    needs: benchmark-policy
    if: needs.benchmark-policy.result == 'success'
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-gpu
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Resolve candidate runtime
        id: runtime
        env:
          RUNTIME_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
        run: >-
          python tools/ci/resolve_runtime.py resolve
          --device "$RUNTIME_DEVICE"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Cache virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: ${{ steps.runtime.outputs.cache-key }}

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          if [[ "$VLLM_GR_TARGET_DEVICE" == "npu" ]]; then
            # The selected base Python must already contain the vendor runtime.
            uv venv --seed --system-site-packages .venv
          else
            uv venv --seed .venv
          fi

      - name: Set up virtual environment
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          {
            echo "VIRTUAL_ENV=${{ github.workspace }}/.venv"
            echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            echo "PRE_COMMIT_HOME=/data/actions/cache/pre-commit-${RUNNER_NAME}-py311"
          } >> "$GITHUB_ENV"

      - name: Install CUDA base environment
        if: >-
          steps.cache-venv.outputs.cache-hit != 'true' &&
          env.VLLM_GR_TARGET_DEVICE == 'cuda'
        run: uv pip install "$CI_VLLM_REQUIREMENT"

      - name: Refresh editable installation
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install -e ".[dev,grpc]"

      - name: Verify gRPC runtime dependencies
        run: |
          python -c 'from vllm_gr.entrypoints.grpc.generated import vllm_engine_pb2, vllm_engine_pb2_grpc; from vllm_gr.entrypoints.grpc.serving import BeamVllmEngineServicer'

      - name: Verify installed runtime identity
        run: >-
          python tools/ci/resolve_runtime.py verify
          --spec "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --venv "$VIRTUAL_ENV"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/installed.json"
          --cache-root "$RUNNER_TEMP/gr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          --github-env "$GITHUB_ENV"

      - name: Verify CUDA device mapping before cleanup
        id: cuda-mapping
        run: |
          python tools/ci/check_cuda_device_mapping.py --output "$CI_CUDA_MAPPING_FILE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Kill stale process on device
        run: bash ./scripts/kill_vllm_on_device.sh

      - name: Install pre-commit
        run: uv pip install pre-commit==4.6.2

      - name: Reset local pre-commit cache
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.rebuild_pre_commit_cache
        run: pre-commit clean

      - name: Run pre-commit
        run: >-
          pre-commit run
          --show-diff-on-failure
          --color=always
          --all-files

      - name: Check clear device
        if: always() && steps.cuda-mapping.outcome == 'success'
        run: bash ./scripts/check_vllm_on_device.sh

  decode-benchmark:
    name: Decode benchmark
    needs: [benchmark-policy, pre-commit]
    if: >-
      needs.benchmark-policy.result == 'success' &&
      needs.pre-commit.result == 'success'
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-gpu
      queue: max
      cancel-in-progress: false
    env:
      BENCHMARK_POLICY_NAME: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_POLICY_NAME }}
      BENCHMARK_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
      ACCURACY_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ACCURACY_FAILURE_MODE }}
      P99_TTFT_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TTFT_FAILURE_MODE }}
      P99_TPOT_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TPOT_FAILURE_MODE }}
      ONLINE_ELAPSED_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ONLINE_ELAPSED_FAILURE_MODE }}
      OFFLINE_ELAPSED_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).OFFLINE_ELAPSED_FAILURE_MODE }}
      PASS_AT_1_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).PASS_AT_1_THRESHOLD }}
      PASS_AT_32_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).PASS_AT_32_THRESHOLD }}
      RECALL_AT_32_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).RECALL_AT_32_THRESHOLD }}
      ELAPSED_TIME_ONLINE_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ELAPSED_TIME_ONLINE_THRESHOLD }}
      ELAPSED_TIME_OFFLINE_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ELAPSED_TIME_OFFLINE_THRESHOLD }}
      P99_TTFT_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TTFT_THRESHOLD }}
      P99_TPOT_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TPOT_THRESHOLD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Resolve candidate runtime
        id: runtime
        env:
          RUNTIME_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
        run: >-
          python tools/ci/resolve_runtime.py resolve
          --device "$RUNTIME_DEVICE"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Restore virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: ${{ steps.runtime.outputs.cache-key }}

      - name: Require cached virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          echo "The pre-commit environment cache is unexpectedly unavailable." >&2
          exit 1

      - name: Set up virtual environment
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          {
            echo "VIRTUAL_ENV=${{ github.workspace }}/.venv"
            echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          } >> "$GITHUB_ENV"

      - name: Refresh editable installation
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install -e ".[dev]"

      - name: Verify installed runtime identity
        run: >-
          python tools/ci/resolve_runtime.py verify
          --spec "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --venv "$VIRTUAL_ENV"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/installed.json"
          --cache-root "$RUNNER_TEMP/gr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          --github-env "$GITHUB_ENV"

      - name: Verify CUDA device mapping before cleanup
        id: cuda-mapping
        run: |
          python tools/ci/check_cuda_device_mapping.py --output "$CI_CUDA_MAPPING_FILE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Kill stale process on device
        run: bash ./scripts/kill_vllm_on_device.sh

      - name: Cache OpenOneRec dataset
        uses: corca-ai/local-cache@v2
        id: cache-dataset
        with:
          path: OpenOneRec
          base: /data/actions/cache
          key: dataset-openonerec-${{ runner.os }}

      - name: Download OpenOneRec dataset
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "HF_TOKEN is required for the gated OpenOneRec dataset." >&2
            exit 1
          fi
          uv tool install hf
          mkdir -p OpenOneRec
          hf download OpenOneRec/OpenOneRec-RecIF \
            --token "$HF_TOKEN" \
            --local-dir ./OpenOneRec \
            --repo-type=dataset

      - name: Build catalog
        run: |
          mkdir -p generated_data
          python ./benchmarks/open_one_rec/tools/create_task_catalog.py \
            -t video \
            -d ./OpenOneRec/benchmark_data \
            -o generated_data/video_catalog.json
          python ./tools/build_constraint_triples.py \
            --catalog generated_data/video_catalog.json \
            --output generated_data/video_constraint_triples.json \
            --begin "<|sid_begin|>" \
            --end "<|sid_end|>"

      - name: Cache OneRec Recall constraint tables
        if: >-
          (github.ref_name == 'decode_graph' ||
           github.event.pull_request.base.ref == 'decode_graph') &&
          env.BENCHMARK_DEVICE == 'gpu'
        uses: corca-ai/local-cache@v2
        id: cache-recall-constraints
        with:
          path: generated_data/recall_constraints
          base: /data/actions/cache
          key: onerec-recall-constraints-v1-${{ runner.os }}-${{ hashFiles('OpenOneRec/benchmark_data/sid2pid.json', 'OpenOneRec/benchmark_data/sid2iid.json') }}

      - name: Build OneRec Recall constraint tables
        if: >-
          (github.ref_name == 'decode_graph' ||
           github.event.pull_request.base.ref == 'decode_graph') &&
          env.BENCHMARK_DEVICE == 'gpu' &&
          steps.cache-recall-constraints.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p generated_data/recall_constraints
          for mapping in sid2pid sid2iid; do
            python benchmarks/open_one_rec/tools/convert_catalog.py \
              --dataset-path OpenOneRec/benchmark_data \
              --mapping-file "$mapping.json" \
              --output-path "generated_data/recall_constraints/$mapping-catalog.json"
            python tools/build_constraint_triples.py \
              --catalog "generated_data/recall_constraints/$mapping-catalog.json" \
              --output "generated_data/recall_constraints/${mapping}_triples.json" \
              --begin '<|sid_begin|>' \
              --end '<|sid_end|>'
            rm "generated_data/recall_constraints/$mapping-catalog.json"
          done

      - name: Gate Beam V1 B=4 OneRec Recall on fixed samples
        if: >-
          (github.ref_name == 'decode_graph' ||
           github.event.pull_request.base.ref == 'decode_graph') &&
          env.BENCHMARK_DEVICE == 'gpu'
        env:
          V1_RECALL_DATASET_PATH: ${{ github.workspace }}/OpenOneRec/benchmark_data
          V1_RECALL_OUTPUT_DIR: ${{ github.workspace }}/v1_recall_results
          V1_RECALL_BASELINE_FILE: ${{ github.workspace }}/benchmarks/beam_search/v1_recall_b4_baseline.json
        run: bash ./tests/system/run_beam_v1_recall.sh

      - name: Upload Beam V1 Recall measurements
        if: >-
          always() &&
          (github.ref_name == 'decode_graph' ||
           github.event.pull_request.base.ref == 'decode_graph') &&
          env.BENCHMARK_DEVICE == 'gpu'
        uses: actions/upload-artifact@v4
        with:
          name: beam-v1-recall-${{ github.run_id }}-${{ github.run_attempt }}
          path: v1_recall_results
          if-no-files-found: warn
          retention-days: 14

      - name: Execute decode benchmark gates
        if: >-
          github.ref_name != 'decode_graph' &&
          github.event.pull_request.base.ref != 'decode_graph'
        env:
          DATASET_PATH: ${{ github.workspace }}/OpenOneRec/benchmark_data
          CATALOG_PATH: ${{ github.workspace }}/generated_data/video_catalog.json
          TRIPLES_PATH: ${{ github.workspace }}/generated_data/video_constraint_triples.json
        run: ./tests/system/run_benchmark_and_verify.sh

      - name: Check clear device
        if: always() && steps.cuda-mapping.outcome == 'success'
        run: bash ./scripts/check_vllm_on_device.sh

  beam-performance-ab-only:
    name: Beam V1 performance A/B only
    needs: [resolve-ab-freshness, pangu-online]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'decode_graph' &&
      ((github.event.action == 'labeled' &&
        github.event.label.name == 'abtest') ||
       (contains(github.event.pull_request.labels.*.name, 'ready') &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         github.event.label.name == 'ready') &&
        needs.resolve-ab-freshness.outputs.fresh != 'true'))
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-gpu
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Require a CUDA runner
        run: nvidia-smi --query-gpu=name --format=csv,noheader

      - name: Resolve candidate runtime
        id: runtime
        run: >-
          python tools/ci/resolve_runtime.py resolve
          --device cuda
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Restore candidate virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: ${{ steps.runtime.outputs.cache-key }}

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv venv --seed .venv

      - name: Set up virtual environment
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
          echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"

      - name: Install candidate CUDA runtime
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv pip install "$CI_VLLM_REQUIREMENT"

      - name: Refresh editable installation
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install -e ".[dev]"

      - name: Verify candidate runtime identity
        run: >-
          python tools/ci/resolve_runtime.py verify
          --spec "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --venv "$VIRTUAL_ENV"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/installed.json"
          --cache-root "$RUNNER_TEMP/gr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          --github-env "$GITHUB_ENV"

      - name: Verify CUDA device mapping before cleanup
        id: cuda-mapping
        run: |
          python tools/ci/check_cuda_device_mapping.py --output "$CI_CUDA_MAPPING_FILE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Kill stale process on device
        run: bash ./scripts/kill_vllm_on_device.sh

      - name: Cache OpenOneRec dataset
        uses: corca-ai/local-cache@v2
        id: cache-dataset
        with:
          path: OpenOneRec
          base: /data/actions/cache
          key: dataset-openonerec-${{ runner.os }}

      - name: Download OpenOneRec dataset
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "HF_TOKEN is required for the gated OpenOneRec dataset." >&2
            exit 1
          fi
          uv tool install hf
          mkdir -p OpenOneRec
          hf download OpenOneRec/OpenOneRec-RecIF \
            --token "$HF_TOKEN" \
            --local-dir ./OpenOneRec \
            --repo-type=dataset

      - name: Build catalog
        run: |
          mkdir -p generated_data
          python ./benchmarks/open_one_rec/tools/create_task_catalog.py \
            -t video \
            -d ./OpenOneRec/benchmark_data \
            -o generated_data/video_catalog.json
          python ./tools/build_constraint_triples.py \
            --catalog generated_data/video_catalog.json \
            --output generated_data/video_constraint_triples.json \
            --begin "<|sid_begin|>" \
            --end "<|sid_end|>"

      - name: Run Beam V1 performance A/B
        env:
          TRIPLES_PATH: ${{ github.workspace }}/generated_data/video_constraint_triples.json
          V1_PERF_OUTPUT_DIR: ${{ github.workspace }}/v1_performance_results
          V1_PERF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          V1_PERF_CANDIDATE_SHA: ${{ github.sha }}
          V1_PERF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          V1_PERF_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash ./tests/system/run_beam_v1_performance_ab.sh

      - name: Upload Beam V1 performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beam-v1-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: v1_performance_results
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Beam V1 A/B report for PR comment
        if: always() && hashFiles('v1_performance_results/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: beam-v1-performance-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v1_performance_results/context.json
            v1_performance_results/report.json
            v1_performance_results/report.md
          if-no-files-found: error
          retention-days: 14

      - name: Check clear device
        if: always() && steps.cuda-mapping.outcome == 'success'
        run: bash ./scripts/check_vllm_on_device.sh

  pangu-offline:
