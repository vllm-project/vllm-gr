name: Pre-commit and Benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # for manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - uses: astral-sh/setup-uv@v1

      - name: Create virtual environment
        run: |
            uv venv --seed .venv
            echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"

      - name: Check for single commit
        if: github.event_name == 'pull_request'  &&  github.event.pull_request.commits != 1
        run: |
          echo "Error: The PR has ${{ github.event.pull_request.commits }} commits. Please squash them into a single commit."
          exit 1

      - name: Install dependencies
        run: |
          uv pip install .[dev]

      - uses: pre-commit/action@v3.0.1

      - name: Save installation and data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-env-data
          path: |
            .venv/
            OpenOneRec/
            generated_data/
          include-hidden-files: true

  benchmark:
    needs: pre-commit
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Download installation and data artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-env-data

      - name: Download OpenOneRec dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN secret is not set. The OpenOneRec dataset is gated and requires a Hugging Face token."
            exit 1
          fi
          git config --global credential.helper store
          pip install huggingface_hub
          huggingface-cli login --token "$HF_TOKEN" --add-to-git-credential
          mkdir -p OpenOneRec
          cd OpenOneRec
          git lfs install
          git clone https://huggingface.co/datasets/OpenOneRec/OpenOneRec-RecIF ./benchmark_data

      - name: Build Catalog
        run: |
          mkdir -p generated_data
          python ./examples/online_serving/catalog/convert_catalog.py ./OpenOneRec/benchmark_data/sid2pid.json generated_data/catalog.json

      - name: Execute benchmark test and verify KPI
        env:
          DATASET_PATH: ${{ github.workspace }}/OpenOneRec/benchmark_data
          CATALOG_PATH: ${{ github.workspace }}/generated_data/catalog.json
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
          ./tests/system/run_benchmark_and_verify.sh
