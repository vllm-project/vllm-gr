name: Pre-commit and Benchmark

# Keep this metadata protocol in sync with retest-router.yml. Including the
# run ID avoids accidental collisions with titles from legacy workflow runs.
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('ci-meta:v1;run={0};pr={1};base={2};base_sha={3};merge_sha={4}',
             github.run_id,
             github.event.pull_request.number,
             github.event.pull_request.base.ref,
             github.event.pull_request.base.sha,
             github.sha) ||
      format('{0}:{1}@{2}', github.event_name, github.ref_name, github.sha) }}

on:
  pull_request:
    branches:
      - main
      - decode_graph
      - develop
      - 'develop/**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
      - decode_graph
      - develop
      - 'develop/**'
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Fetch target branch benchmark policy
        id: benchmark-policy
        uses: actions/github-script@v7
        env:
          POLICY_REF: >-
            ${{ github.event.pull_request.base.sha || github.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = process.env.POLICY_REF;
            const policyRepoPath = '.github/benchmark-gate.yaml';
            const resolverRepoPath =
              'tools/ci/resolve_benchmark_policy.py';
            const outputPath = path.join(
              process.env.RUNNER_TEMP,
              'benchmark-gate.yaml',
            );
            const resolverOutputPath = path.join(
              process.env.RUNNER_TEMP,
              'resolve-benchmark-policy.py',
            );

            const fetchFile = async (repoPath, fileRef = ref) => {
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: repoPath,
                  ref: fileRef,
                });
                if (Array.isArray(response.data) ||
                    response.data.type !== 'file' ||
                    !response.data.content) {
                  throw new Error(
                    `${repoPath}@${fileRef} is not a readable file`,
                  );
                }
                return Buffer.from(
                  response.data.content,
                  response.data.encoding,
                ).toString('utf8');
              } catch (error) {
                if (error.status === 404) {
                  return null;
                }
                throw error;
              }
            };

            const policy = await fetchFile(policyRepoPath);
            let resolver = await fetchFile(resolverRepoPath);
            let resolverRef = ref;
            if (resolver === null && policy !== null) {
              const defaultBranch =
                context.payload.repository.default_branch;
              const {data: defaultBranchData} =
                await github.rest.repos.getBranch({
                  owner,
                  repo,
                  branch: defaultBranch,
                });
              resolverRef = defaultBranchData.commit.sha;
              resolver = await fetchFile(resolverRepoPath, resolverRef);
            }
            let bootstrap = false;
            if (policy === null) {
              if (context.eventName === 'pull_request' &&
                  resolver === null) {
                bootstrap = true;
              } else {
                throw new Error(
                  `Required benchmark policy ${policyRepoPath} is missing ` +
                  `from ${ref}`,
                );
              }
            } else {
              fs.writeFileSync(outputPath, policy, {encoding: 'utf8'});
            }
            if (resolver !== null) {
              fs.writeFileSync(
                resolverOutputPath,
                resolver,
                {encoding: 'utf8'},
              );
            }

            core.setOutput('bootstrap', String(bootstrap));
            core.setOutput('path', outputPath);
            core.setOutput('ref', ref);
            core.setOutput(
              'resolver-path',
              resolver === null ? resolverRepoPath : resolverOutputPath,
            );
            core.setOutput('resolver-ref', resolverRef);
            core.setOutput(
              'migration-resolver',
              String(resolver === null),
            );

      - uses: astral-sh/setup-uv@v1

      - name: Cache virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: venv-${{ runner.os }}-vllm0.22.1-${{ hashFiles('pyproject.toml', 'requirements/*.txt', 'setup.py') }}

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
            uv venv --seed .venv

      - name: Set up virtual environment
        run: |
            echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"

      - name: Check for single commit
        if: github.event_name == 'pull_request'  &&  github.event.pull_request.commits != 1
        run: |
          echo "Error: The PR has ${{ github.event.pull_request.commits }} commits. Please squash them into a single commit."
          exit 1

      - name: Install base environment (vllm)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          uv pip install vllm==0.22.1

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install -e ".[dev]"

      - name: Install vllm-gr (editable refresh)
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install -e ".[dev]"

      - name: Verify vLLM compatibility
        run: |
          python -c 'import importlib.metadata as m; version = m.version("vllm").partition("+")[0]; assert version == "0.22.1", f"Expected vLLM 0.22.1, found {version}"'
          python -c 'import importlib.metadata as m; version = m.version("vllm-gr").partition("+")[0]; assert version == "0.22.1", f"Expected vLLM-GR 0.22.1, found {version}"'

      - name: Resolve benchmark gate policy
        env:
          BOOTSTRAP_POLICY: ${{ steps.benchmark-policy.outputs.bootstrap }}
          POLICY_FILE: ${{ steps.benchmark-policy.outputs.path }}
          POLICY_REF: ${{ steps.benchmark-policy.outputs.ref }}
          POLICY_RESOLVER: ${{ steps.benchmark-policy.outputs.resolver-path }}
          POLICY_RESOLVER_REF: ${{ steps.benchmark-policy.outputs.resolver-ref }}
          MIGRATION_RESOLVER: ${{ steps.benchmark-policy.outputs.migration-resolver }}
        run: |
          device="gpu"
          board_id="unknown"
          if command -v npu-smi > /dev/null 2>&1; then
            device="npu"
            board_id="$(
              python -c 'import acl; print(acl.get_soc_name())' \
                2>/dev/null || echo unknown
            )"
          fi

          args=(
            --device "$device"
            --board-id "$board_id"
            --source-ref "$POLICY_REF"
            --github-env "$GITHUB_ENV"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$BOOTSTRAP_POLICY" == "true" ]]; then
            args+=(--bootstrap-strict)
          else
            args+=(--policy-file "$POLICY_FILE")
          fi

          if [[ "$MIGRATION_RESOLVER" == "true" ]]; then
            echo "Using the checked-out resolver for one-time policy migration."
          else
            echo "Using benchmark policy resolver from $POLICY_RESOLVER_REF."
          fi
          python "$POLICY_RESOLVER" "${args[@]}"

      - name: Kill Process on device
        run: |
          bash ./scripts/kill_vllm_on_device.sh

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

      - name: Cache OpenOneRec dataset
        uses: corca-ai/local-cache@v2
        id: cache-dataset
        with:
          path: OpenOneRec
          base: /data/actions/cache
          key: dataset-openonerec-${{ runner.os }}

      - name: Download OpenOneRec dataset
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN secret is not set. The OpenOneRec dataset is gated and requires a Hugging Face token."
            exit 1
          fi
          uv tool install hf
          mkdir -p OpenOneRec
          hf download OpenOneRec/OpenOneRec-RecIF --token "$HF_TOKEN" --local-dir ./OpenOneRec --repo-type=dataset


      - name: Build Catalog
        run: |
          mkdir -p generated_data
          python ./benchmarks/open_one_rec/tools/create_task_catalog.py \
            -t video \
            -d ./OpenOneRec/benchmark_data \
            -o generated_data/video_catalog.json

      - name: Execute benchmark test and verify KPI
        env:
          DATASET_PATH: ${{ github.workspace }}/OpenOneRec/benchmark_data
          CATALOG_PATH: ${{ github.workspace }}/generated_data/video_catalog.json
        run: |
          ./tests/system/run_benchmark_and_verify.sh

      - name: Cache Pangu 1B model
        uses: corca-ai/local-cache@v2
        id: cache-pangu1b
        with:
          path: openPangu-Embedded-1B-V1.1
          base: /data/actions/cache
          key: pangu1b-model-${{ runner.os }}

      - name: Download Pangu 1B model
        if: steps.cache-pangu1b.outputs.cache-hit != 'true'
        run: |
          pip install modelscope
          modelscope download --model FreedomIntelligence/openPangu-Embedded-1B-V1.1 \
            --local_dir ${{ github.workspace }}/openPangu-Embedded-1B-V1.1

      - name: Run Pangu 1B accuracy and verification
        env:
          PANGU1B_MODEL_PATH: ${{ github.workspace }}/openPangu-Embedded-1B-V1.1
          PANGU1B_MIN_ACCURACY: 1.00
        run: |
          bash ./tests/system/run_pangu1b_acc_and_verify.sh
          bash ./tests/system/run_pangu1b_online_and_verify.sh

      - name: Check Clear Device
        run: |
          bash ./scripts/check_vllm_on_device.sh
