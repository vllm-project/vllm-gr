name: Build Wheel

on:
  push:
    branches:
      - main
      - decode_graph
      - develop
      - 'develop/**'
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.github/**'
      - '.buildkite/**'
      - '**.md'
      - '*.yml'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - decode_graph
      - develop
      - 'develop/**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.github/**'
      - '.buildkite/**'
      - '*.yml'
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv

      - name: Build Wheel
        env:
          UV_SYSTEM_PYTHON: 1
          VLLM_GR_TARGET_DEVICE: cpu
        run: |
          bash scripts/build_wheel.sh --python python

      - name: Upload Wheel Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: vllm-gr-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
