name: Build Wheel

on:
  pull_request:
    branches:
      - main
      - 'release/v*'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.github/**'
      - '.buildkite/**'
      - '*.yml'
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  # Unrelated label edits must not cancel queued or running CI for this PR.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number || github.ref
    }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ready' && format('ignored-{0}', github.run_id) || 'ci'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       contains(github.event.pull_request.labels.*.name, 'ready') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ready'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        target-device: ["cpu", "cuda", "npu"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv pytest pytest-timeout packaging regex

      - name: Build and smoke-test wheel
        env:
          UV_SYSTEM_PYTHON: 1
          VLLM_GR_TARGET_DEVICE: ${{ matrix.target-device }}
        run: |
          # Packaging tests cover tags/fallbacks; the smoke test checks that
          # installed module and distribution versions agree for this target.
          bash tools/run_wheel_smoke_test.sh --python python

      - name: Check external provider against the built core wheel
        if: matrix.target-device == 'cpu' && matrix.python-version == '3.12'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          wheel=(dist/*.whl)
          digest=$(sha256sum "${wheel[0]}" | cut -d ' ' -f 1)
          python tools/run_provider_conformance.py "${wheel[0]}" --sha256 "$digest"

      - name: Upload Wheel Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: vllm-gr-${{ matrix.target-device }}-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 3
