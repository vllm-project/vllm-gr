# Reference policy snapshot: 2026-11. Hardware-specific measurements and setup
# are documented in docs/contributing/ci/benchmark_acceptance.md. These thresholds are
# not universal performance guarantees; calibrate them for your own hardware.
# Board keys are compatibility selectors, not required server hostnames.
version: 2
name: development

thresholds:
  accuracy:
    pass_at_1_min: 0.09
    pass_at_32_min: 0.29
    recall_at_32_min: 0.04

  performance:
    online_elapsed_seconds_max: 20
    offline_elapsed_seconds_max: 20
    p99_ttft_max: 300
    p99_tpot_max: 0.02

failure_modes:
  accuracy: blocking
  performance:
    p99_ttft: warning
    p99_tpot: warning
    online_elapsed_seconds: warning
    offline_elapsed_seconds: warning
  online_non_accuracy: blocking

device_overrides:
  gpu:
    boards:
      decode_graph_gpu:
        # Logical policy selector for every GPU on decode_graph, not a GPU model.
        # A100 CI offline result + L20 correctness reference.
        # A100 online uses the explicitly accepted offline-floor assumption.
        # Gate scope and policy selection: docs/contributing/ci/benchmark_acceptance.md.
        thresholds:
          accuracy: &decode_graph_accuracy
            pass_at_1_min: 0.05
            pass_at_32_min: 0.21
            recall_at_32_min: 0.030
  npu:
    boards:
      Ascend910_9362:
        thresholds:
          accuracy: *decode_graph_accuracy
          performance: &ascend910_9362_performance
            p99_ttft_max: 280
            online_elapsed_seconds_max: 20
            offline_elapsed_seconds_max: 25
      Ascend_9362:
        # Compatibility alias; retain the default performance thresholds.
        thresholds:
          accuracy: *decode_graph_accuracy
      Ascend910B1:
        thresholds:
          accuracy: *decode_graph_accuracy
      unknown:
        thresholds:
          accuracy: *decode_graph_accuracy
      decode_graph_npu:
        thresholds:
          accuracy: *decode_graph_accuracy
      decode_graph_Ascend910_9362:
        # Retain this board's performance overrides alongside the shared floors.
        thresholds:
          accuracy: *decode_graph_accuracy
          performance: *ascend910_9362_performance
