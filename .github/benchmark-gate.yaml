version: 2
name: development

thresholds:
  accuracy:
    pass_at_1_min: 0.09
    pass_at_32_min: 0.29
    recall_at_32_min: 0.04

  performance:
    online_elapsed_seconds_max: 20
    offline_elapsed_seconds_max: 20
    p99_ttft_max: 300
    p99_tpot_max: 0.02

failure_modes:
  accuracy: blocking
  performance:
    p99_ttft: warning
    p99_tpot: warning
    online_elapsed_seconds: warning
    offline_elapsed_seconds: warning
  online_non_accuracy: blocking

pangu1b:
  thresholds:
    offline_accuracy_min: 1.00
    online_accuracy_min: 1.00
  failure_modes:
    offline_accuracy: blocking
    online_accuracy: blocking
  device_overrides:
    npu:
      thresholds:
        offline_accuracy_min: 0.875
        online_accuracy_min: 0.875

device_overrides:
  npu:
    boards:
      Ascend910_9362:
        thresholds:
          performance:
            p99_ttft_max: 280
            online_elapsed_seconds_max: 20
            offline_elapsed_seconds_max: 25
