name: Prepare isolated device environment
description: Restore a runner-local environment and bootstrap cold workers
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@v1
    - uses: corca-ai/local-cache@v2
      id: cache
      with:
        path: .venv
        base: /data/actions/cache
        key: venv-v2-${{ runner.name }}-${{ runner.os }}-${{ runner.arch }}-vllm0.22.1-${{ hashFiles('pyproject.toml', 'requirements/*.txt', 'setup.py') }}
    - name: Bootstrap cold runner
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        uv venv --seed .venv
        uv pip install --python .venv/bin/python vllm==0.22.1
    - name: Refresh checkout and expose environment
      shell: bash
      run: |
        export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
        uv pip install --python .venv/bin/python -e '.[dev]'
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
        echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"
        .venv/bin/python -c 'import importlib.metadata as m; assert m.version("vllm").partition("+")[0] == "0.22.1"; assert m.version("vllm-gr").partition("+")[0] == "0.22.1"'
