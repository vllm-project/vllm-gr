name: 🛠️ Installation
description: Report an issue here when you hit errors during installation.
title: "[Installation]: "
labels: ["installation"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an issue, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/vllm-project/vllm-gr/issues?q=is%3Aissue+sort%3Acreated-desc+).
- type: textarea
  attributes:
    label: Your current environment
    description: |
      Run `python collect_env.py` in the affected Python environment and paste the output below.
      If you installed from a wheel, [download collect_env.py](https://github.com/vllm-project/vllm-gr/raw/refs/heads/main/collect_env.py) first.
      Review the script before running it and the output before sharing it.
    value: |
      ```text
      The output of `python collect_env.py`
      ```
  validations:
    required: true
- type: textarea
  attributes:
    label: How you are installing vllm-gr
    description: |
      Paste the full command you are trying to execute.
    value: |
      ```sh
      pip install -vvv vllm-gr
      ```
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
- type: checkboxes
  id: askllm
  attributes:
    label: Before submitting a new issue...
    options:
      - label: Make sure you already searched for relevant issues, and asked the chatbot living at the bottom right corner of the [documentation page](https://vllm-gr.readthedocs.io), which can answer lots of frequently asked questions.
        required: true
