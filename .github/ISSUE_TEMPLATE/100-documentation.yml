name: 📚 Documentation
description: Report an issue related to documentation
title: "[Doc]: "
labels: ["documentation"]

body:
- type: textarea
  attributes:
    label: 📚 The doc issue
    description: >
      A clear and concise description of what content in the documentation is an issue.
  validations:
    required: true
- type: textarea
  attributes:
    label: Suggest a potential alternative/fix
    description: >
      Tell us how we could improve the documentation in this regard.
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
- type: checkboxes
  id: prior-search
  attributes:
    label: Before submitting a new issue...
    options:
      - label: I have checked the [repository documentation](https://github.com/JiusiServe/vllm-gr/blob/main/docs/index.md) and searched [existing issues](https://github.com/JiusiServe/vllm-gr/issues).
        required: true
