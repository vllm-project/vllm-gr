<svg xmlns="http://www.w3.org/2000/svg" width="900" height="382" viewBox="0 0 900 382" role="img" aria-labelledby="title desc">
  <title id="title">Ascend Decode and KV reorder</title>
  <desc id="desc">The worker independently dispatches attention and KV reorder. Valid mixed batches use cascade attention. Fused reorder requires xllm and full-width parents in ascending source order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 4 L 1 7" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="900" height="382" fill="#ffffff" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#252627">
    <rect x="275" y="14" width="350" height="46" fill="#d7f1f1" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="450.0" y="42.61" font-size="17" font-weight="400" text-anchor="middle">Decode rows and session KV</text>
    <rect x="41" y="107" width="347" height="52" fill="#fbe6d5" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="214.5" y="138.61" font-size="17" font-weight="400" text-anchor="middle">Fused XAttention</text>
    <rect x="512" y="107" width="347" height="52" fill="#fbe6d5" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="685.5" y="138.61" font-size="17" font-weight="400" text-anchor="middle">Cascade attention</text>
    <rect x="275" y="204" width="350" height="50" fill="#d7f1f1" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="450.0" y="234.61" font-size="17" font-weight="400" text-anchor="middle">Select winning parents</text>
    <rect x="41" y="314" width="347" height="50" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="214.5" y="344.61" font-size="17" font-weight="400" text-anchor="middle">Fused KV reorder</text>
    <rect x="512" y="314" width="347" height="50" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="685.5" y="344.61" font-size="17" font-weight="400" text-anchor="middle">Cascade KV reorder</text>
    <path d="M 350,60 L 350,75 L 215,75 L 215,107" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 550,60 L 550,75 L 685,75 L 685,107" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="172" y="59.95" font-size="15" font-weight="400" text-anchor="middle">Eligible xllm batch</text>
    <text x="729" y="59.95" font-size="15" font-weight="400" text-anchor="middle">Cascade or mixed batch</text>
    <path d="M 215,159 L 215,229 L 275,229" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 685,159 L 685,229 L 625,229" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 350,254 L 350,272 L 215,272 L 215,314" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="201" y="294.95" font-size="15" font-weight="400" text-anchor="end">xllm, full width, grouped</text>
    <path d="M 550,254 L 550,272 L 685,272 L 685,314" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="696" y="294.95" font-size="15" font-weight="400" text-anchor="start">Other cases</text>
  </g>
</svg>
