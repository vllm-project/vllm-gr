<svg xmlns="http://www.w3.org/2000/svg" width="940" height="564" viewBox="0 0 940 564" role="img" aria-labelledby="title desc">
  <title id="title">Beam batch execution</title>
  <desc id="desc">The frontend submits the complete batch once. The engine schedules its stages, collects worker receipts and returns a single ordered result after retirement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 4 L 1 7" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="940" height="564" fill="#ffffff" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#252627">
    <path d="M 90.0,60 L 90.0,548" fill="none" stroke="#888b86" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="5 5" />
    <rect x="7.0" y="20" width="166" height="40" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="90.0" y="45.61" font-size="17" font-weight="600" text-anchor="middle">Frontend</text>
    <path d="M 343.33333333333337,60 L 343.33333333333337,548" fill="none" stroke="#888b86" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="5 5" />
    <rect x="260.33333333333337" y="20" width="166" height="40" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="343.33333333333337" y="45.61" font-size="17" font-weight="600" text-anchor="middle">EngineCore</text>
    <path d="M 596.6666666666667,60 L 596.6666666666667,548" fill="none" stroke="#888b86" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="5 5" />
    <rect x="513.6666666666667" y="20" width="166" height="40" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="596.6666666666667" y="45.61" font-size="17" font-weight="600" text-anchor="middle">GR scheduler</text>
    <path d="M 850.0,60 L 850.0,548" fill="none" stroke="#888b86" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="5 5" />
    <rect x="767.0" y="20" width="166" height="40" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="850.0" y="45.61" font-size="17" font-weight="600" text-anchor="middle">Device worker</text>
    <path d="M 90.0,110 L 343.33333333333337,110" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="216.66666666666669" y="101" font-size="16" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Submit fixed batch</text>
    <path d="M 343.33333333333337,156 L 596.6666666666667,156" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="470.00000000000006" y="147" font-size="16" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Register batch and requests</text>
    <rect x="432.2" y="182" width="328.9" height="34" fill="#d7f1f1" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="596.65" y="203.95" font-size="15" font-weight="400" text-anchor="middle">For Prefill and each scheduled Decode</text>
    <path d="M 343.33333333333337,248 L 596.6666666666667,248" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="470.00000000000006" y="239" font-size="16" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Schedule stage</text>
    <path d="M 596.6666666666667,294 L 343.33333333333337,294" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5" />
    <text x="470.00000000000006" y="285" font-size="16" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Tokens and stage metadata</text>
    <path d="M 343.33333333333337,340 L 850.0,340" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="596.6666666666667" y="331" font-size="16" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Dispatch through executor</text>
    <path d="M 850.0,386 L 343.33333333333337,386" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5" />
    <text x="596.6666666666667" y="377" font-size="16" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Stage receipt when ready</text>
    <path d="M 343.33333333333337,432 L 596.6666666666667,432" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="470.00000000000006" y="423" font-size="16" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Apply stage receipt</text>
    <rect x="255.4" y="458" width="429.1" height="34" fill="#d7f1f1" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="469.95000000000005" y="479.95" font-size="15" font-weight="400" text-anchor="middle">Finalize after terminal result, drain and release</text>
    <path d="M 343.33333333333337,524 L 90.0,524" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5" />
    <text x="216.66666666666669" y="515" font-size="16" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Ordered batch result</text>
  </g>
</svg>
