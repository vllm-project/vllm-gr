<svg xmlns="http://www.w3.org/2000/svg" width="860" height="510" viewBox="0 0 860 510" role="img" aria-labelledby="title desc">
  <title id="title">CUDA ModelRunner V2 Prefill dispatch</title>
  <desc id="desc">An eligible batch picks the smallest token bucket. A FULL miss tries PIECEWISE at that bucket, then eager execution. A missing bucket goes directly to eager execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="860" height="510" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#252627">
    <path d="M 420 70 V 88" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 270 138 H 140 V 224" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 420 188 V 224" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 580 278 H 650" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 420 332 V 368" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 580 422 H 650" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 260 422 H 140 V 276" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="310" y="18" width="220" height="52" rx="8" fill="#e3f1d9" stroke="#252627" stroke-width="1.5"/>
    <text x="420" y="49" font-size="16" text-anchor="middle" fill="#252627">Prefill batch</text>
    <polygon points="420,88 570,138 420,188 270,138" fill="#fff4cc" stroke="#252627" stroke-width="1.5"/>
    <text x="420" y="134" font-size="15" text-anchor="middle" fill="#252627"><tspan x="420" dy="0">Smallest fitting</tspan><tspan x="420" dy="19">token bucket?</tspan></text>
    <rect x="40" y="224" width="200" height="52" rx="8" fill="#f6d5d5" stroke="#252627" stroke-width="1.5"/>
    <text x="140" y="255" font-size="16" text-anchor="middle" fill="#252627">Run eagerly</text>
    <polygon points="420,224 580,278 420,332 260,278" fill="#fff4cc" stroke="#252627" stroke-width="1.5"/>
    <text x="420" y="274" font-size="15" text-anchor="middle" fill="#252627"><tspan x="420" dy="0">Compatible, captured</tspan><tspan x="420" dy="19">FULL shape (T, B)?</tspan></text>
    <rect x="650" y="252" width="180" height="52" rx="8" fill="#d7f1f1" stroke="#252627" stroke-width="1.5"/>
    <text x="740" y="283" font-size="16" text-anchor="middle" fill="#252627">Replay FULL</text>
    <polygon points="420,368 580,422 420,476 260,422" fill="#fff4cc" stroke="#252627" stroke-width="1.5"/>
    <text x="420" y="418" font-size="15" text-anchor="middle" fill="#252627"><tspan x="420" dy="0">PIECEWISE capture</tspan><tspan x="420" dy="19">at the same T?</tspan></text>
    <rect x="650" y="396" width="180" height="52" rx="8" fill="#fbe6d5" stroke="#252627" stroke-width="1.5"/>
    <text x="740" y="427" font-size="16" text-anchor="middle" fill="#252627">Replay PIECEWISE</text>
    <text x="205" y="126" font-size="13" text-anchor="middle" fill="#5f6368">No</text>
    <text x="434" y="211" font-size="13" text-anchor="start" fill="#5f6368">Yes</text>
    <text x="615" y="266" font-size="13" text-anchor="middle" fill="#5f6368">Yes</text>
    <text x="434" y="355" font-size="13" text-anchor="start" fill="#5f6368">No</text>
    <text x="615" y="410" font-size="13" text-anchor="middle" fill="#5f6368">Yes</text>
    <text x="200" y="410" font-size="13" text-anchor="middle" fill="#5f6368">No</text>
  </g>
</svg>
