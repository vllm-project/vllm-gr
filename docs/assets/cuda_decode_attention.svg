<svg xmlns="http://www.w3.org/2000/svg" width="930" height="405" viewBox="0 0 930 405" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Beam Decode attention</title>
  <desc id="desc">Shared-prefix attention supplies output and LSE. For each beam, one of two paths combines that state with its suffix KV: a fused kernel or packed suffix attention and a separate merge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 4 L 1 7" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="930" height="405" fill="#ffffff" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#252627">
    <rect x="29" y="18" width="256" height="52" fill="#d7f1f1" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="157.0" y="49.61" font-size="17" font-weight="400" text-anchor="middle">Shared prompt pages</text>
    <rect x="341" y="18" width="272" height="52" fill="#f9dce0" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="477.0" y="49.61" font-size="17" font-weight="400" text-anchor="middle">Native or segmented prefix</text>
    <rect x="341" y="105" width="272" height="51" fill="#d7f1f1" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="477.0" y="136.11" font-size="17" font-weight="400" text-anchor="middle">Prefix output + FP32 LSE</text>
    <rect x="650" y="105" width="248" height="51" fill="#d7f1f1" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="774.0" y="136.11" font-size="17" font-weight="400" text-anchor="middle">Per-beam suffix KV</text>
    <rect x="477" y="192" width="280" height="45" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="617.0" y="220.11" font-size="17" font-weight="400" text-anchor="middle">Choose suffix path</text>
    <rect x="55" y="270" width="358" height="58" fill="#fbe6d5" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="234.0" y="294.11" font-size="17" font-weight="400" text-anchor="middle">Packed suffix attention,</text>
    <text x="234.0" y="315.11" font-size="17" font-weight="400" text-anchor="middle">then a separate merge</text>
    <rect x="524" y="270" width="358" height="58" fill="#fbe6d5" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="703.0" y="294.11" font-size="17" font-weight="400" text-anchor="middle">Fused suffix attention</text>
    <text x="703.0" y="315.11" font-size="17" font-weight="400" text-anchor="middle">and final merge</text>
    <rect x="338" y="354" width="257" height="40" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="466.5" y="379.61" font-size="17" font-weight="400" text-anchor="middle">Per-beam output</text>
    <path d="M 285,44 L 341,44" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 477,70 L 477,105" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 477,156 L 477,172 L 550,172 L 550,192" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 774,156 L 774,172 L 686,172 L 686,192" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 477,214 L 234,214 L 234,270" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="249" y="245.95" font-size="15" font-weight="400" text-anchor="start">Mixed batch or fusion off</text>
    <path d="M 703,237 L 703,270" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="798" y="256.95" font-size="15" font-weight="400" text-anchor="middle">Eligible pure Decode</text>
    <path d="M 234,328 L 234,374 L 338,374" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 703,328 L 703,374 L 595,374" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
  </g>
</svg>
