<svg xmlns="http://www.w3.org/2000/svg" width="925" height="285" viewBox="0 0 925 285" role="img" aria-labelledby="title desc">
  <title id="title">Overlapping CUDA Decode stages</title>
  <desc id="desc">The host prepares the next layout while the compute stream selects tokens. Both feed the next Decode. A separate stream copies the previous stage status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 4 L 1 7" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="925" height="285" fill="#ffffff" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#252627">
    <rect x="18" y="42" width="155" height="49" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="95.5" y="72.11" font-size="17" font-weight="600" text-anchor="middle">Worker host</text>
    <rect x="18" y="129" width="155" height="49" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="95.5" y="159.11" font-size="17" font-weight="600" text-anchor="middle">Compute stream</text>
    <rect x="18" y="216" width="155" height="49" fill="#e3f1d9" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="95.5" y="246.11" font-size="17" font-weight="600" text-anchor="middle">Copy stream</text>
    <rect x="195" y="42" width="153" height="49" fill="#f9dce0" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="271.5" y="72.11" font-size="17" font-weight="400" text-anchor="middle">Queue sampling</text>
    <rect x="400" y="42" width="225" height="49" fill="#fbe6d5" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="512.5" y="72.11" font-size="17" font-weight="400" text-anchor="middle">Prepare layout for k+1</text>
    <rect x="385" y="129" width="223" height="49" fill="#f9dce0" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="496.5" y="159.11" font-size="17" font-weight="400" text-anchor="middle">Select tokens for k</text>
    <rect x="698" y="129" width="205" height="49" fill="#fbe6d5" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="800.5" y="159.11" font-size="17" font-weight="400" text-anchor="middle">Run Decode k+1</text>
    <rect x="676" y="216" width="227" height="49" fill="#d7f1f1" stroke="#252627" stroke-width="1.5" rx="6" />
    <text x="789.5" y="246.11" font-size="17" font-weight="400" text-anchor="middle">Copy status for k</text>
    <path d="M 348,66 L 400,66" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 271,91 L 271,153 L 385,153" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 625,66 L 800,66 L 800,129" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 608,153 L 698,153" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 645,153 L 645,240 L 676,240" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" />
  </g>
</svg>
