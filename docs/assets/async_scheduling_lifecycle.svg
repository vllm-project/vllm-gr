<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="393" viewBox="0 0 1020 393" role="img" aria-labelledby="title desc">
  <title id="title">Beam session lifecycle</title>
  <desc id="desc">Normal completion drains issued work and retires once worker release is confirmed. A cleanup step runs if the worker still owns resources. A queued cancellation goes straight to retirement, and an active cancellation goes through Draining.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <marker id="cancel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1020" height="393" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#252627">
    <!-- Normal transitions and the receipt loop. -->
    <path d="M 142 148 H 212" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 332 148 H 402" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 522 148 H 632" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 762 148 H 862" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 425 122 C 425 67 499 67 499 122" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 697 174 V 248" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 762 274 H 925 V 174" fill="none" stroke="#252627" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <!-- Cancellation routes enter Draining and Retired at separate ports. -->
    <path d="M 82 174 V 360 H 976 V 174" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#cancel-arrow)"/>
    <path d="M 462 174 V 227 H 650 V 174" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#cancel-arrow)"/>
    <rect x="22" y="122" width="120" height="52" rx="8" fill="#e3f1d9" stroke="#252627" stroke-width="1.5"/>
    <text x="82" y="153" font-size="16" text-anchor="middle" fill="#252627">Admitted</text>
    <rect x="212" y="122" width="120" height="52" rx="8" fill="#f9dce0" stroke="#252627" stroke-width="1.5"/>
    <text x="272" y="153" font-size="16" text-anchor="middle" fill="#252627">Owned</text>
    <rect x="402" y="122" width="120" height="52" rx="8" fill="#fbe6d5" stroke="#252627" stroke-width="1.5"/>
    <text x="462" y="153" font-size="16" text-anchor="middle" fill="#252627">Issuing</text>
    <rect x="632" y="122" width="130" height="52" rx="8" fill="#fbe6d5" stroke="#252627" stroke-width="1.5"/>
    <text x="697" y="153" font-size="16" text-anchor="middle" fill="#252627">Draining</text>
    <rect x="862" y="122" width="130" height="52" rx="8" fill="#d7f1f1" stroke="#252627" stroke-width="1.5"/>
    <text x="927" y="153" font-size="16" text-anchor="middle" fill="#252627">Retired</text>
    <rect x="632" y="248" width="130" height="52" rx="8" fill="#f9dce0" stroke="#252627" stroke-width="1.5"/>
    <text x="697" y="279" font-size="16" text-anchor="middle" fill="#252627">Releasing</text>
    <text x="177" y="110" font-size="13" text-anchor="middle" fill="#5f6368">Scheduler admits owner</text>
    <text x="367" y="110" font-size="13" text-anchor="middle" fill="#5f6368">Stage scheduled</text>
    <text x="577" y="110" font-size="13" text-anchor="middle" fill="#5f6368">No stages left to issue</text>
    <text x="812" y="110" font-size="13" text-anchor="middle" fill="#5f6368">Worker confirmed release</text>
    <text x="462" y="69" font-size="13" text-anchor="middle" fill="#5f6368">Receipt, next stage</text>
    <text x="712" y="210" font-size="13" text-anchor="start" fill="#5f6368">Worker still owns resources</text>
    <text x="843" y="263" font-size="13" text-anchor="middle" fill="#5f6368">Cleanup acknowledged</text>
    <text x="556" y="216" font-size="13" text-anchor="middle" fill="#b3261e">Active cancel</text>
    <text x="221" y="349" font-size="13" text-anchor="middle" fill="#b3261e">Queued cancel</text>
  </g>
</svg>
