      - tests/test_npu_multi_trie_routing.py
      - tests/test_ascend_compat.py
      - tests/contract/test_upstream_patch_contracts.py::test_core_hot_update_utility_contracts
      - tests/sidecar/test_management.py
    process_roles: [engine_core]
    target: vllm.v1.engine.core.EngineCoreProc and EngineCore.service_status/pause/resume/reload_trie
    risk: critical
    contract: engine-core-signatures
    removal_condition: vLLM exposes stable control-message, request-dispatch, and named management utility extension points

  - id: GR-PATCH-010
    scope: core
    backend_id: null
    owner: vllm_gr/v1/engine/engine_core_patch.py and gr_async_scheduler.py
    installer: vllm_gr.v1.engine.engine_core_patch.apply_scheduler_patch
    activation: the EngineCore patch plan detects scheduler metadata propagation is absent
    validator_or_test:
      - vllm_gr.patch._validate_scheduler_patch
      - tests/contract/test_engine_core_protocol_contracts.py
    process_roles: [engine_core]
    target: vllm.v1.core.sched.scheduler.Scheduler.schedule
    risk: critical
    contract: scheduler-contract
    removal_condition: explicit upstream scheduler metadata hooks carry grouped Beam state

  - id: GR-PATCH-011
    scope: backend
    backend_id: cuda
    owner: vllm_gr/v1/worker/gpu_model_runner_patch.py and gpu_model_runner_v2_patch.py
    shared_helpers: vllm_gr/v1/worker/model_runner_common.py, vllm_gr/v1/worker/gpu_postprocess_workspace.py, vllm_gr/v1/worker/gpu_model_runner_v2_resources.py, vllm_gr/v1/worker/gpu_prefill_inputs.py, vllm_gr/v1/worker/gpu_prefill_v2.py, vllm_gr/v1/worker/hot_update.py, vllm_gr/constraints/versioned_table.py, vllm_gr/v1/worker/gpu_stage_hooks.py, vllm_gr/v1/worker/gpu_beam_stage_runner.py, vllm_gr/v1/worker/gpu_beam_stage_runner_v1.py, vllm_gr/v1/worker/gpu_beam_stage_runner_v2.py
    installer: vllm_gr.v1.worker.model_runner_patch.apply_worker_patches
    activation: the selected CUDA ModelRunner V1 or V2 is discovered and its hooks are incomplete; the common installer mounts Worker utilities and model-load hooks regardless of the management listener; V2 prepares stage Top-K variants before initial or replacement table publication; V2 Prefill fast paths require admitted pure GR batches; fused state writes additionally require fresh complete prompts, empty request state and no pending writes
    validator_or_test:
      - vllm_gr.patch._validate_model_runner_patch
      - tests/test_gpu_model_runner_patch.py
      - tests/test_gpu_postprocess_workspace.py
      - tests/platforms/test_import_isolation.py
      - tests/kernels/test_beam_batch_switch_reuse.py
      - tests/test_gpu_model_runner_v2_patch.py
      - tests/kernels/test_gr_prefill_v2.py
      - tests/kernels/test_v2_multibatch_graphs.py
      - tests/kernels/test_beam_pool_recapture.py
      - tests/kernels/test_stage_topk_v2.py
      - tests/test_model_runner_patch.py
      - tests/test_model_runner_patch.py::test_active_cuda_worker_hot_update_utility_contract
      - tests/sidecar/test_worker_update.py
      - tests/v1/worker/test_constraint_lifecycle.py
      - tests/test_model_runner_stage_binding.py
      - tests/test_cuda_native_output.py
      - tests/test_v2_multibatch.py
      - tests/kernels/test_gpu_beam_stage_lifecycle.py
      - tests/kernels/test_gpu_beam_stage_v2_state.py
      - tests/test_gr_startup.py
      - tests/tools/test_cuda_stage_typing.py
      - tests/e2e/function/test_modelrunner_v2_stage_parity_st.py
    process_roles: [gpu_worker]
    target: vllm.v1.worker.gpu_model_runner.GPUModelRunner, vllm.v1.worker.gpu.model_runner.GPUModelRunner, and vllm.v1.worker.gpu_worker.Worker.reload_trie
    risk: critical
    contract: gpu-model-runner-signatures
    removal_condition: stable upstream grouped input/output, Worker utility, and constraint-backend lifecycle hooks replace private runner mutation

  - id: GR-PATCH-012
    scope: backend
    backend_id: npu
    owner: vllm_gr/v1/worker/npu_model_runner_patch.py
    shared_helpers: vllm_gr/v1/worker/model_runner_common.py, vllm_gr/v1/worker/hot_update.py, vllm_gr/constraints/versioned_table.py, vllm_gr/v1/ascend_compat.py
    installer: vllm_gr.v1.worker.model_runner_patch.apply_worker_patches
    activation: NPUModelRunner is discovered for the active platform and its hooks are incomplete; the delayed NPUWorker.init_device wrapper mounts common Worker utilities before native initialization, independently of the management listener; online Trie reload remains rejected by Core on NPU
    validator_or_test:
      - vllm_gr.patch._validate_model_runner_patch
      - tests/test_npu_model_runner_patch.py
      - tests/test_model_runner_patch.py
      - tests/test_npu_prefill_bsnd.py
      - tests/test_prefill_graph_runner.py
      - tests/test_ascend_compat.py::test_npu_worker_patch_is_lazy_and_preserves_lifecycle_contract
      - tests/sidecar/test_management.py::test_trie_rejects_unsupported_execution_before_worker_rpc
      - tests/sidecar/test_worker_update.py
    process_roles: [npu_worker]
    target: vllm_ascend.worker.model_runner_v1.NPUModelRunner and vllm_ascend.worker.worker.NPUWorker.reload_trie
    risk: critical
    contract: docs/npu_prefill_bsnd.md
    removal_condition: vLLM-Ascend exposes stable grouped input/output, Worker utility, and constraint-backend lifecycle hooks

  - id: GR-PATCH-013
    scope: core
    backend_id: null
    owner: vllm_gr/v1/attention/backends/beam_attn.py
    installer: vllm_gr.v1.attention.backends.beam_attn register_backend decorator
    activation: the facade module is imported and CUSTOM is selected for GR Beam Attention
    validator_or_test:
      - tests/test_beam_attention_platform_execution.py
      - tests/test_beam_attention_metadata.py
      - tests/test_attention_backend_custom.py
    process_roles: [engine_core, worker]
    target: vllm.v1.attention.backends.registry.AttentionBackendEnum.CUSTOM
    risk: high
    contract: custom-attention-registry
    ownership:
      metadata_builder: vllm_gr.v1.attention.backends.beam_attn_metadata
      gpu_execution: vllm_gr.v1.attention.backends.beam_attn_gpu
      npu_execution: vllm_gr.v1.attention.backends.beam_attn_npu
      backend_registration_and_facade: vllm_gr.v1.attention.backends.beam_attn
      compatibility_exports:
        - BeamAttentionMetadata
        - BeamAttentionMetadataBuilder
        - BEAM_DATA_VAR
    removal_condition: vLLM supports named third-party backend identities without a shared CUSTOM slot

  - id: GR-PATCH-015
    scope: core
    backend_id: null
    owner: vllm_gr/ops/sliced_logits.py
    shared_helpers: vllm_gr/ops/lm_head_cache.py
    installer: vllm_gr.ops.sliced_logits_patch.apply_sliced_logits_patch
    activation: projection hooks execute with a valid slice; cache reload hooks install after model load by ParallelLMHead type, independent of module names
    validator_or_test:
      - vllm_gr.ops.sliced_logits_patch.apply_sliced_logits_patch return value
      - tests/test_sliced_logits.py
      - tests/platforms/test_import_isolation.py::test_cuda_plugin_initialization_does_not_import_ascend
      - tests/sidecar/test_worker_update.py::test_sliced_cache_survives_native_layerwise_reload
      - tests/test_patch_initialization.py::test_optional_patch_count_tracks_actual_installation
    process_roles: [worker]
    target: LogitsProcessor, Sampler.gather_logprobs, V2 compute_topk_scores, and quant_method.process_weights_after_loading for dense ParallelLMHead weights and tied owners
    risk: medium
    contract: sliced-vocabulary-projection
    removal_condition: vLLM exposes stable output-projection and logprob-width hooks

  - id: GR-PATCH-016
    scope: backend
    backend_id: npu
    owner: vllm_gr/npu_spawn_patch.py
    installer: vllm_gr.npu_spawn_patch.apply_npu_spawn_patch
    activation: the selected NPU provider installs or repairs spawn protection before importing the native worker
    validator_or_test:
      - vllm_gr.npu_spawn_patch.apply_npu_spawn_patch return value
      - tests/test_patch_initialization.py::test_npu_spawn_patch_wraps_upstream_force_spawn_and_both_bindings
      - tests/test_patch_initialization.py::test_npu_spawn_patch_forces_spawn_only_when_npu_initialized
    process_roles: [main, engine_core]
    target: vllm.utils.system_utils._maybe_force_spawn
    risk: medium
    contract: npu-spawn-start-method
    removal_condition: upstream _maybe_force_spawn() covers NPU (or delegates to the platform interface)

  - id: GR-PATCH-018
    scope: backend
    backend_id: npu
    owner: vllm_gr/v1/ascend_compat.py
    installer: vllm_gr.v1.ascend_compat.apply_penalties_warmup_oom_guard
    activation: NPUWorker init_device runs in the child process and the native penalties warmup callable is present
    validator_or_test:
      - vllm_gr.v1.ascend_compat.apply_penalties_warmup_oom_guard return value
      - NPU end-to-end benchmark gate (engine startup at --max_num_seqs 2048)
    process_roles: [npu_worker]
    target: vllm_ascend.model_executor.warmup.kernel_warmup.penalties_triton_warmup
    risk: medium
    contract: npu-penalties-warmup-oom
    removal_condition: vllm-ascend sizes the warmup dummies from the available NPU budget, or vllm-gr no longer runs a large vocabulary beside the KV cache

  - id: GR-PATCH-019
    scope: backend
    backend_id: npu
    owner: vllm_gr/v1/ascend_compat.py
    installer: vllm_gr.v1.ascend_compat.apply_engine_core_config_sanitizer and patch_npu_worker_init_device
    activation: NPU engine configuration and every worker plugin initialization, independently of the device hook; repair native config caller bindings even when the sanitizer is installed; entrypoint re-asserted on every create_engine_config call and initializes the shared EngineCore plan before native construction
    validator_or_test:
      - vllm_gr.v1.ascend_compat.apply_engine_core_config_sanitizer return value
      - tests/test_ascend_compat.py::test_ascend_config_filter_preserves_engine_identity_and_gr_config
      - tests/test_ascend_compat.py::test_ascend_config_filter_restores_mapping_on_native_failure
      - tests/test_ascend_compat.py::test_ascend_entry_installs_filter_before_delegating
      - tests/test_ascend_compat.py::test_worker_installs_config_filter_before_constructor
      - tests/test_ascend_compat.py::test_worker_rechecks_config_bindings_without_rewrapping_device_hook
      - tests/test_ascend_compat.py::test_config_binding_recheck_preserves_unrelated_overrides
      - NPU EngineCore startup (vllm-ascend AscendConfig pydantic extra="forbid")
    process_roles: [main, engine_core, worker]
    target: vllm.v1.engine.core.EngineCoreProc.run_engine_core and vllm_ascend.ascend_config.init_ascend_config
    risk: high
    contract: ascend-config-additional-config-keys
    removal_condition: vllm-ascend's AscendConfig accepts unknown additional_config keys, or vllm-gr stops carrying its configuration in additional_config

  - id: GR-PATCH-020
    scope: core
    backend_id: null
    owner: vllm_gr/pangu_compat.py
    installer: vllm_gr.pangu_compat.apply_pangu_tied_embeddings_patch
    activation: runtime initialization; wrapper preserves ties only for PanguEmbeddedForCausalLM with tie_word_embeddings enabled
    validator_or_test:
      - tests/test_pangu_compat.py
      - tests/test_patch_initialization.py::test_runtime_patch_order_preserves_ascend_initialization
    process_roles: [main, engine_core, worker]
    target: vllm.config.ModelConfig.maybe_untie_word_embeddings
    risk: high
    contract: pangu-tied-embeddings
    removal_condition: upstream distinguishes Pangu's zero-filled lm_head placeholder from an independent projection weight

  - id: GR-PATCH-021
    scope: backend
    backend_id: npu
    owner: vllm_gr/v1/npu_kv_layout.py
    installer: vllm_gr.v1.npu_kv_layout.apply_npu_contiguous_kv_cache_patch
    activation: NPUWorker init_device before native runner construction; known Ascend 0.30.0rc2 bindings
    validator_or_test:
      - tests/test_npu_kv_layout.py
      - tests/test_ascend_compat.py::test_npu_worker_patch_is_lazy_and_preserves_lifecycle_contract
      - tests/test_npu_beam_row_views.py
    process_roles: [npu_worker]
    target: vllm_ascend.attention.utils.requires_contiguous_pa_kv_cache and its model_runner_v1 import binding
    risk: high
    contract: npu-contiguous-prefix-kv-allocation
    removal_condition: Ascend exposes a backend contiguous-KV capability covering GR xllm without a native policy bridge

# IDs are retained here when the installer and its legacy surface have been removed.
retired_patches:
  - id: GR-PATCH-006
    historical_target: OpenAIServingModels.__init__
    reason: Legacy Catalog serving patch and its tests were removed; canonical V1 constraints load in the worker
    replacement_coverage:
      - tests/constraints/test_cuda_backend.py::test_canonical_worker_enables_vocab_slice_before_first_forward
      - tests/test_gr_config_v1.py
  - id: GR-PATCH-014
    historical_target: LMCache RequestTracker, ReqMeta, and LMCacheConnectorV1Impl
    reason: Experimental LMCache integration removed; no supported version pin or vLLM 0.30 validation
    replacement_coverage: []
  - id: GR-PATCH-017
    historical_target: NPUWorker.profile_memory in vllm_ascend.worker.worker or vllm_ascend.worker.worker_v1
    reason: Removal condition met by the 0.30 upgrade; vllm-ascend 0.30.0rc2 replaced profile_memory with log_memory_stats, which reads the two allocator counters directly, and the installer found no native method to wrap on that runtime
    replacement_coverage:
      - tests/test_ascend_compat.py::test_npu_worker_patch_is_lazy_and_preserves_lifecycle_contract
