schema_version: 1

verified_baseline:
  vllm: "0.22.1"
  vllm_ascend: "0.22.1rc1"

patches:
  - id: GR-PATCH-000
    owner: vllm_gr/plugin.py
    installer: vllm_gr.plugin.register
    activation: vLLM loads the vllm.general_plugins entry point
    validator_or_test:
      - tests/test_patch_initialization.py::test_plugin_exposes_simple_per_patch_status
    process_roles: [main, engine_core, worker]
    target: vllm_gr.plugin.register
    risk: high
    contract: plugin-entrypoint
    removal_condition: runtime patch installation is no longer required

  - id: GR-PATCH-001
    owner: vllm_gr/v1/ascend_compat.py
    installer: vllm_gr.v1.ascend_compat.apply_ascend_attention_backend_patch
    activation: CUSTOM is registered and its backend slot is overridden
    validator_or_test:
      - tests/test_ascend_compat.py::test_selector_installation_is_idempotent_and_force_uses_original
      - tests/integration/test_ascend_attention_backend.py
    process_roles: [engine_core, worker]
    target: vllm.v1.attention.selector._cached_get_attn_backend
    risk: critical
    contract: attention-selector-signature
    removal_condition: vLLM-Ascend preserves and resolves explicit CUSTOM backend intent

  - id: GR-PATCH-002
    owner: vllm_gr/v1/ascend_compat.py and vllm_gr/ops/npu/ffn.py
    installer: >-
      vllm_gr.v1.ascend_compat.patch_npu_worker_init_device, optionally delegating to
      vllm_gr.ops.npu.ffn.install_npu_fused_ffn_worker_hook
    activation: >-
      the active platform is NPU and the initialization hook is not installed;
      the optional load_model wrapper requires VLLM_GR_NPU_FUSED_FFN=1,
      and model-local FFN binding requires eligible graph configuration after loading
    validator_or_test:
      - tests/test_ascend_compat.py::test_npu_worker_patch_is_lazy_and_preserves_lifecycle_contract
      - tests/test_ops_npu_ffn.py::test_disabled_ffn_keeps_native_worker_and_does_not_load_extension
      - tests/test_ops_npu_ffn.py::test_worker_load_hook_preserves_order_errors_and_idempotence
      - tests/st/test_npu_fused_ffn.py::test_npu_fused_ffn_opt_in_graph_precision_and_fallback
    process_roles: [worker]
    target: >-
      NPUWorker.init_device and optional NPUWorker.load_model in
      vllm_ascend.worker.worker_v1 (or worker fallback)
    risk: high
    contract: null
    removal_condition: >-
      stable NPU worker hooks install compatibility before ModelRunner construction
      and support optional model-local FFN binding after loading and before warmup

  - id: GR-PATCH-003
    owner: vllm_gr/logprobs.py
    installer: vllm_gr.logprobs_patch.patch_flat_logprobs
    activation: the required frontend patch plan detects the method is not installed
    validator_or_test:
      - vllm_gr.patch._validate_flat_logprobs_patch
      - tests/test_patch_initialization.py
    process_roles: [offline_frontend, api_server]
    target: vllm.logprobs.FlatLogprobs.append_fast
    risk: medium
    contract: null
    removal_condition: the GR implementation is no longer needed or is available upstream

  - id: GR-PATCH-004
    owner: vllm_gr/entrypoints/openai/serving_engine.py and protocol.py
    installer: vllm_gr.entrypoints.openai.beam_search_patch.patch_beam_search and patch_sampling
    activation: the required frontend patch plan detects either method is not installed
    validator_or_test:
      - vllm_gr.patch._validate_openai_beam_search_patch
      - vllm_gr.patch._validate_chat_sampling_patch
      - tests/test_beam_search_dispatch.py
    process_roles: [api_server]
    target: OpenAIServing.beam_search and ChatCompletionRequest.to_beam_search_params
    risk: high
    contract: null
    removal_condition: upstream exposes grouped-Beam serving and sampling extension points

  - id: GR-PATCH-005
    owner: vllm_gr/engine/arg_utils_gr.py
    installer: vllm_gr.engine.arg_utils_gr.patch_add_cli_args
    activation: the required frontend patch plan detects GR EngineArgs methods are not installed
    validator_or_test:
      - vllm_gr.patch._validate_engine_args_patch
      - tests/test_attention_backend_custom.py
    process_roles: [main, api_server]
    target: vllm.engine.arg_utils.EngineArgs
    risk: high
    contract: engine-args-descriptors
    removal_condition: vLLM configuration hooks cover every active GR option

  - id: GR-PATCH-007
    owner: vllm_gr/v1/engine/core_client.py, core_client_patch.py, and async_llm.py
    installer: vllm_gr.entrypoints.openai.beam_search_patch.patch_batch_and_fork
    activation: the required frontend patch plan detects grouped Beam client methods are incomplete
    validator_or_test:
      - vllm_gr.patch._validate_batch_and_fork_patch
      - tests/test_beam_admission_rejection_reporting.py
    process_roles: [api_server]
    target: EngineCore clients and AsyncLLM
    risk: critical
    contract: null
    removal_condition: vLLM exposes stable grouped request, control-message, and routing hooks

  - id: GR-PATCH-008
    owner: vllm_gr/v1/engine/wire.py
    installer: vllm_gr.v1.engine.wire.register_engine_core_request_types
    activation: frontend and EngineCore installers require the GR wire values
    validator_or_test:
      - vllm_gr.patch._validate_request_types_patch
      - tests/contract/test_engine_core_protocol_contracts.py
    process_roles: [api_server, engine_core]
    target: vllm.v1.engine.EngineCoreRequestType
    risk: critical
    contract: engine-wire-values
    removal_condition: stable upstream messages carry grouped Beam operations without Enum mutation

  - id: GR-PATCH-009
    owner: vllm_gr/v1/engine/core.py and engine_core_patch.py
    installer: vllm_gr.v1.engine.engine_core_patch.apply_engine_core_request_patches
    activation: the EngineCore patch plan detects request dispatch is incomplete
    validator_or_test:
      - vllm_gr.patch._validate_engine_core_request_group
      - vllm_gr.patch._validate_engine_core_entrypoint_patch
      - tests/test_gr_async_scheduler.py
    process_roles: [engine_core]
    target: vllm.v1.engine.core.EngineCoreProc
    risk: critical
    contract: engine-core-signatures
    removal_condition: vLLM exposes stable control-message and request-dispatch extension points

  - id: GR-PATCH-010
    owner: vllm_gr/v1/engine/engine_core_patch.py and gr_async_scheduler.py
    installer: vllm_gr.v1.engine.engine_core_patch.apply_scheduler_patch
    activation: the EngineCore patch plan detects scheduler metadata propagation is absent
    validator_or_test:
      - vllm_gr.patch._validate_scheduler_patch
      - tests/contract/test_engine_core_protocol_contracts.py
    process_roles: [engine_core]
    target: vllm.v1.core.sched.scheduler.Scheduler.schedule
    risk: critical
    contract: scheduler-contract
    removal_condition: explicit upstream scheduler metadata hooks carry grouped Beam state

  - id: GR-PATCH-011
    owner: vllm_gr/v1/worker/gpu_model_runner_patch.py
    shared_helpers: vllm_gr/v1/worker/model_runner_common.py
    installer: vllm_gr.v1.worker.model_runner_patch.apply_worker_patches
    activation: GPUModelRunner is discovered for the active platform and its hooks are incomplete
    validator_or_test:
      - vllm_gr.patch._validate_model_runner_patch
      - tests/test_gpu_model_runner_patch.py
      - tests/test_model_runner_patch.py
    process_roles: [gpu_worker]
    target: vllm.v1.worker.gpu_model_runner.GPUModelRunner
    risk: critical
    contract: gpu-model-runner-signatures
    removal_condition: stable upstream grouped input and output hooks replace private runner mutation

  - id: GR-PATCH-012
    owner: vllm_gr/v1/worker/npu_model_runner_patch.py
    shared_helpers: vllm_gr/v1/worker/model_runner_common.py
    installer: vllm_gr.v1.worker.model_runner_patch.apply_worker_patches
    activation: NPUModelRunner is discovered for the active platform and its hooks are incomplete
    validator_or_test:
      - vllm_gr.patch._validate_model_runner_patch
      - tests/test_npu_model_runner_patch.py
      - tests/test_model_runner_patch.py
    process_roles: [npu_worker]
    target: vllm_ascend.worker.model_runner_v1.NPUModelRunner
    risk: critical
    contract: null
    removal_condition: vLLM-Ascend exposes stable grouped input and output hooks

  - id: GR-PATCH-013
    owner: vllm_gr/v1/attention/backends/beam_attn.py
    installer: vllm_gr.v1.attention.backends.beam_attn register_backend decorator
    activation: the facade module is imported and CUSTOM is selected for GR Beam Attention
    validator_or_test:
      - tests/test_beam_attention_platform_execution.py
      - tests/test_beam_attention_metadata.py
      - tests/test_attention_backend_custom.py
    process_roles: [engine_core, worker]
    target: vllm.v1.attention.backends.registry.AttentionBackendEnum.CUSTOM
    risk: high
    contract: custom-attention-registry
    ownership:
      metadata_builder: vllm_gr.v1.attention.backends.beam_attn_metadata
      gpu_execution: vllm_gr.v1.attention.backends.beam_attn_gpu
      npu_execution: vllm_gr.v1.attention.backends.beam_attn_npu
      backend_registration_and_facade: vllm_gr.v1.attention.backends.beam_attn
      compatibility_exports:
        - BeamAttentionMetadata
        - BeamAttentionMetadataBuilder
        - BEAM_DATA_VAR
        - _compute_beam_bounds
    removal_condition: vLLM supports named third-party backend identities without a shared CUSTOM slot

  - id: GR-PATCH-014
    owner: vllm_gr/3rd_party/lmcache/integration/vllm/vllm_v1_adapter.py
    installer: vllm_gr.lmcache_patch.apply_lmcache_adapter
    activation: VLLM_GR_LMCACHE_PATCH is true or argv selects LMCacheConnectorV1
    validator_or_test:
      - vllm_gr.lmcache_patch.apply_lmcache_adapter return value
      - tests/test_patch_initialization.py::test_optional_patch_count_tracks_actual_installation
    process_roles: [worker]
    target: LMCacheConnectorV1Impl
    risk: critical
    contract: null
    removal_condition: LMCache exposes grouped Beam metadata and lifecycle extension points

  - id: GR-PATCH-015
    owner: vllm_gr/ops/sliced_logits.py
    installer: vllm_gr.ops.sliced_logits_patch.apply_sliced_logits_patch
    activation: hooks install at runtime initialization and execute only with a valid vocabulary slice
    validator_or_test:
      - vllm_gr.ops.sliced_logits_patch.apply_sliced_logits_patch return value
      - tests/test_sliced_logits.py
      - tests/test_patch_initialization.py::test_optional_patch_count_tracks_actual_installation
    process_roles: [worker]
    target: LogitsProcessor and Sampler
    risk: medium
    contract: sliced-vocabulary-projection
    removal_condition: vLLM exposes stable output-projection and logprob-width hooks

  - id: GR-PATCH-016
    owner: vllm_gr/npu_spawn_patch.py
    installer: vllm_gr.npu_spawn_patch.apply_npu_spawn_patch
    activation: engine configuration loading triggers the vllm.general_plugins entry point
    validator_or_test:
      - vllm_gr.npu_spawn_patch.apply_npu_spawn_patch return value
      - tests/test_patch_initialization.py::test_npu_spawn_patch_wraps_upstream_force_spawn_and_both_bindings
      - tests/test_patch_initialization.py::test_npu_spawn_patch_forces_spawn_only_when_npu_initialized
    process_roles: [main, engine_core]
    target: vllm.utils.system_utils._maybe_force_spawn
    risk: medium
    contract: npu-spawn-start-method
    removal_condition: upstream _maybe_force_spawn() covers NPU (or delegates to the platform interface)

  - id: GR-PATCH-017
    owner: vllm_gr/v1/worker/npu_memory_counters.py
    installer: vllm_gr.v1.worker.npu_memory_counters.install_npu_memory_counter_patch
    activation: the NPUWorker init_device hook finds a supported native profile_memory method and the public nested memory API
    validator_or_test:
      - tests/test_npu_memory_counters.py::test_one_snapshot_preserves_counters_and_original_logger
      - tests/test_npu_memory_counters.py::test_uninitialized_and_missing_counters_match_native_zero_defaults
      - tests/test_npu_memory_counters.py::test_each_call_refreshes_fields_and_installation_is_idempotent
      - tests/test_npu_memory_counters.py::test_missing_nested_api_keeps_original_method
      - tests/test_npu_memory_counters.py::test_unknown_worker_profiles_keep_original_semantics
      - tests/test_npu_memory_counters.py::test_changed_nested_schema_falls_back_to_native
      - tests/test_npu_memory_counters.py::test_allocator_errors_are_propagated
      - tests/test_npu_memory_counters.py::test_module_import_does_not_load_npu_runtime
      - tests/test_ascend_compat.py::test_npu_worker_patch_is_lazy_and_preserves_lifecycle_contract
    process_roles: [npu_worker]
    target: NPUWorker.profile_memory in vllm_ascend.worker.worker or vllm_ascend.worker.worker_v1
    risk: medium
    contract: npu-worker-memory-counters
    supported_runtime:
      vllm_ascend: "0.22.1rc1"
      torch_npu: "2.10.0"
    removal_condition: vLLM-Ascend reads the two allocator counters without flattening full memory statistics
