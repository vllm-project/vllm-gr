      - vllm_gr.patch._validate_chat_sampling_patch
      - tests/test_beam_search_v1_online_entry.py
      - tests/e2e/function/test_onerec_v1_scheduler_st.py::test_onerec_v1_completion_batch_online
      - tests/test_beam_search_dispatch.py
    process_roles: [api_server]
    target: GenerateBaseServing.beam_search/beam_search_v1 and ChatCompletionRequest/CompletionRequest.to_beam_search_params
    risk: high
    contract: null
    removal_condition: upstream exposes grouped-Beam serving and sampling extension points

  - id: GR-PATCH-005
