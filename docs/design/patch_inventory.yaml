# Authoritative ownership for the remaining runtime compatibility hooks.
schema_version: 3
pre_upgrade_baseline:
  vllm: 0.22.1
  vllm_ascend: 0.22.1rc1
current_runtime:
  cuda:
    vllm: 0.30.0
  npu:
    vllm: 0.30.0
    vllm_ascend: 0.30.0rc2
patches:
- id: GR-PATCH-000
  scope: core
  backend_id: null
  owner: vllm_gr/plugin.py
  installer: vllm_gr.plugin.register
  activation: vLLM loads the general plugin; GR discovers an independent platform and installs an engine-scoped
    CUSTOM selector bridge without replacing native current_platform or the CUSTOM registry
  validator_or_test:
  - tests/patch/test_patch_initialization.py::test_plugin_exposes_simple_per_patch_status
  - tests/platforms/test_platform_attention_seam.py
  - tests/platforms/test_runtime_wiring.py
  - tests/platforms/test_platform_plugins.py
  - tests/platforms/test_import_isolation.py::test_cuda_plugin_initialization_does_not_import_ascend
  process_roles:
  - main
  - engine_core
  - worker
  target: vllm_gr.plugin.register and vllm.v1.attention.selector._cached_get_attn_backend
  risk: high
  contract: plugin-entrypoint
  removal_condition: runtime patch installation is no longer required
- id: GR-PATCH-003
  scope: core
  backend_id: null
  owner: vllm_gr/v1/engine/logprobs_patch.py
  installer: vllm_gr.v1.engine.logprobs_patch.patch_flat_logprobs
  activation: the required frontend patch plan detects the method is not installed
  validator_or_test:
  - vllm_gr.v1.engine.logprobs_patch.validate_flat_logprobs_patch
  - tests/patch/test_patch_initialization.py::test_flat_logprobs_patch_preserves_offsets_and_optional_columns
  process_roles:
  - offline_frontend
  - api_server
  target: vllm.logprobs.FlatLogprobs.append_fast
  risk: medium
  contract: null
  removal_condition: the GR implementation is no longer needed or is available upstream
- id: GR-PATCH-004
  scope: core
  backend_id: null
  owner: vllm_gr/entrypoints/openai/serving_engine.py and protocol.py
  installer: vllm_gr.entrypoints.openai.beam_search_patch.patch_beam_search and patch_sampling
  activation: the required frontend patch plan detects a missing serving or sampling binding, or a mismatched Completion
    vllm_xargs schema
  validator_or_test:
  - vllm_gr.entrypoints.openai.beam_search_patch.validate_openai_beam_search_patch
  - vllm_gr.entrypoints.openai.beam_search_patch.validate_sampling_patch
  - tests/entrypoints/beam_search/test_beam_search_online_entry.py
  - tests/e2e/test_onerec_v1_scheduler_st.py::test_onerec_v1_completion_batch_online
  - tests/entrypoints/openai/test_beam_search_dispatch.py
  process_roles:
  - api_server
  target: GenerateBaseServing.beam_search, ChatCompletionRequest/CompletionRequest.to_beam_search_params, and CompletionRequest.model_fields["vllm_xargs"]
  risk: high
  contract: beam_search adapts upstream callers exclusively to the GR implementation
  removal_condition: upstream exposes grouped-Beam serving and sampling extension points
- id: GR-PATCH-005
  scope: core
  backend_id: null
  owner: vllm_gr/engine/arg_utils.py
  installer: vllm_gr.engine.arg_utils.patch_create_engine_config
  activation: the frontend installs the creation hook; only engines carrying GR settings run GR finalization
  validator_or_test:
  - vllm_gr.engine.arg_utils.validate_engine_args_patch
  - tests/engine/test_native_engine_args_example.py
  - tests/v1/attention/test_attention_backend_custom.py
  - tests/engine/test_gr_config.py::test_canonical_inputs_produce_identical_worker_configuration
  process_roles:
  - main
  - api_server
  target: vllm.engine.arg_utils.EngineArgs.create_engine_config
  risk: high
  contract: engine-args-descriptors
  removal_condition: vLLM configuration hooks cover every active GR option
- id: GR-PATCH-007
  scope: core
  backend_id: null
  owner: vllm_gr/v1/engine/core_client.py, core_client_patch.py, beam_session_client.py, and output_processor.py
  installer: vllm_gr.patch.install_engine_session_hooks
  activation: the required frontend patch plan detects grouped Beam client methods are incomplete
  validator_or_test:
  - vllm_gr.patch._validate_engine_session_hooks
  - tests/v1/beam/test_beam_request_unit.py
  - tests/v1/engine/test_gr_admission_queue.py
  - tests/entrypoints/beam_search/test_beam_search_online_entry.py
  - tests/v1/engine/test_beam_admission_rejection_reporting.py
  - tests/e2e/test_engine_entrypoint_startup.py
  process_roles:
  - main
  - api_server
  target: EngineCore clients and AsyncLLM
  risk: critical
  contract: null
  removal_condition: vLLM exposes stable grouped request, control-message, and routing hooks
- id: GR-PATCH-008
  scope: core
  backend_id: null
  owner: vllm_gr/v1/engine/wire.py
  installer: vllm_gr.v1.engine.wire.register_engine_core_request_types
  activation: frontend and EngineCore installers require the GR wire values
  validator_or_test:
  - vllm_gr.v1.engine.wire.validate_request_types_patch
  - tests/contract/test_engine_core_protocol_contracts.py
  process_roles:
  - api_server
  - engine_core
  target: vllm.v1.engine.EngineCoreRequestType
  risk: critical
  contract: engine-wire-values
  removal_condition: stable upstream messages carry grouped Beam operations without Enum mutation
- id: GR-PATCH-009
  scope: core
  backend_id: null
  owner: vllm_gr/v1/engine/core.py, core_socket.py, engine_core_patch.py, and hot_update.py
  installer: vllm_gr.v1.engine.engine_core_patch.apply_engine_core_request_patches
  activation: the shared EngineCore plan, including the sanitized NPU child entrypoint, detects incomplete request
    dispatch or Trie-capacity initialization; the constructor also verifies actual Worker readiness before accepting
    requests; the same installer mounts hot-update utilities independently of the optional management listener
  validator_or_test:
  - vllm_gr.v1.engine.engine_core_patch.validate_engine_core_request_group
  - vllm_gr.v1.engine.engine_core_patch.validate_engine_core_entrypoint_patch
  - tests/v1/engine/test_gr_async_scheduler.py
  - tests/constraints/test_npu_multi_trie_routing.py
  - tests/v1/test_ascend_compat.py
  - tests/contract/test_upstream_patch_contracts.py::test_core_hot_update_utility_contracts
  - tests/sidecar/test_management.py
  - tests/platforms/test_worker_readiness.py
  process_roles:
  - engine_core
  target: vllm.v1.engine.core.EngineCoreProc and EngineCore.service_status/pause/resume/reload_trie
  risk: critical
  contract: engine-core-signatures
  removal_condition: vLLM exposes stable control-message, request-dispatch, and named management utility extension
    points
- id: GR-PATCH-010
  scope: core
  backend_id: null
  owner: vllm_gr/v1/core/sched/scheduler_patch.py and beam_async_scheduler.py
  shared_helpers: vllm_gr/v1/core/sched/beam_session.py, vllm_gr/v1/beam/dispatch.py
  installer: vllm_gr.v1.core.sched.scheduler_patch.apply_scheduler_patch
  activation: the EngineCore patch plan detects a missing schedule or update_from_output wrapper
  validator_or_test:
  - vllm_gr.v1.core.sched.scheduler_patch.validate_scheduler_patch
  - tests/v1/engine/test_gr_async_scheduler.py
  - tests/patch/test_patch_initialization.py::test_scheduler_plan_repairs_partial_install
  process_roles:
  - engine_core
  target: Scheduler.schedule and Scheduler.update_from_output in vllm.v1.core.sched.scheduler
  risk: critical
  contract: scheduler-contract
  removal_condition: explicit upstream scheduler metadata hooks carry grouped Beam state
- id: GR-PATCH-022
  scope: core
  backend_id: null
  owner: vllm_gr/v1/core/kv_cache_utils.py
  installer: vllm_gr.v1.core.kv_cache_utils.apply_kv_hash_memo_patch
  activation: the EngineCore plan detects a missing block or chain hash wrapper or a stale EngineCore factory binding
  validator_or_test:
  - vllm_gr.v1.core.kv_cache_utils.validate_kv_hash_memo_patch
  - tests/v1/core/test_gr_plain_hash_chain.py
  - tests/patch/test_patch_initialization.py::test_kv_hash_memo_patch_equivalence_and_hits
  - tests/patch/test_patch_initialization.py::test_kv_hash_memo_plan_repairs_partial_install
  process_roles:
  - engine_core
  target: vllm.v1.core.kv_cache_utils.hash_block_tokens and get_request_block_hasher, plus vllm.v1.engine.core.get_request_block_hasher
  risk: high
  contract: prefix-cache-hash-equivalence
  removal_condition: upstream provides equivalent prefix hashing for repeated prompts
- id: GR-PATCH-011
  scope: backend
  backend_id: cuda
  owner: vllm_gr/v1/worker/cuda/numpy_staging.py
  installer: vllm_gr.v1.worker.cuda.numpy_staging.install_numpy_staging
  activation: CudaGRWorker.init_device installs bulk array staging before native V2 buffer construction; native
    Worker and ModelRunner execution methods are no longer mutated
  validator_or_test:
  - tests/kernels/test_gr_prefill_v2.py
  - tests/v1/worker/test_model_runner_patch.py
  process_roles:
  - gpu_worker
  target: StagedWriteTensor.stage_write and buffer_utils.async_tensor_h2d
  risk: high
  contract: Native array staging retains asynchronous transfer lifetime
  removal_condition: Native StagedWriteTensor supports bulk array staging with the GR token buffer contract
- id: GR-PATCH-012
  scope: backend
  backend_id: ascend
  owner: vllm_gr/v1/worker/npu/stage_projection.py
  installer: vllm_gr.v1.worker.npu.stage_projection.install_npu_stage_weight_update_hooks
  activation: AscendGRWorker installs weight-update wrappers on its own subclass; model load attaches the instance
    stage projection; native NPUModelRunner and NPUWorker classes are unchanged
  validator_or_test:
  - tests/v1/worker/test_npu_stage_projection_lifecycle.py
  - tests/ops/test_npu_stage_logits.py
  process_roles:
  - npu_worker
  target: AscendGRWorker weight-update methods and the loaded model LogitsProcessor instance
  risk: high
  contract: Invalidate and refresh fixed-address stage projection around native weight writes
  removal_condition: Native weight-update callbacks cover stage projection lifecycle
- id: GR-PATCH-015
  scope: core
  backend_id: null
  owner: vllm_gr/v1/worker/sliced_logits_patch.py
  shared_helpers: vllm_gr/ops/sliced_logits.py, vllm_gr/v1/worker/lm_head_cache.py
  installer: vllm_gr.v1.worker.sliced_logits_patch.apply_sliced_logits_patch
  activation: projection uses the token window on the model's LogitsProcessor; cache reload hooks install after
    model load by ParallelLMHead type, independent of module names
  validator_or_test:
  - tests/ops/test_sliced_logits.py
  - tests/platforms/test_import_isolation.py::test_cuda_plugin_initialization_does_not_import_ascend
  - tests/sidecar/test_worker_update.py::test_sliced_cache_survives_native_layerwise_reload
  - tests/patch/test_patch_initialization.py::test_optional_patch_count_tracks_actual_installation
  process_roles:
  - worker
  target: LogitsProcessor._get_logits, Sampler.gather_logprobs, V2 compute_topk_scores, and quant_method.process_weights_after_loading
    for dense ParallelLMHead weights and tied owners
  risk: medium
  contract: sliced-vocabulary-projection
  removal_condition: vLLM exposes stable output-projection and logprob-width hooks
- id: GR-PATCH-016
  scope: backend
  backend_id: ascend
  owner: vllm_gr/platforms/ascend/spawn_patch.py
  installer: vllm_gr.platforms.ascend.spawn_patch.apply_npu_spawn_patch
  activation: the selected Ascend integration installs or repairs spawn protection before importing the native worker
  validator_or_test:
  - tests/patch/test_patch_initialization.py::test_npu_spawn_patch_wraps_upstream_force_spawn_and_both_bindings
  - tests/patch/test_patch_initialization.py::test_npu_spawn_patch_forces_spawn_only_when_npu_initialized
  process_roles:
  - main
  - engine_core
  target: vllm.utils.system_utils._maybe_force_spawn
  risk: medium
  contract: npu-spawn-start-method
  removal_condition: upstream _maybe_force_spawn() covers NPU (or delegates to the platform interface)
- id: GR-PATCH-018
  scope: backend
  backend_id: ascend
  owner: vllm_gr/v1/worker/npu/startup_patch.py
  installer: vllm_gr.v1.worker.npu.startup_patch.apply_penalties_warmup_oom_guard
  activation: AscendGRWorker.init_device runs in the child process and the native penalties warmup callable is present
  validator_or_test: []
  process_roles:
  - npu_worker
  target: vllm_ascend.model_executor.warmup.kernel_warmup.penalties_triton_warmup
  risk: medium
  contract: npu-penalties-warmup-oom
  removal_condition: vllm-ascend sizes the warmup dummies from the available NPU budget, or vllm-gr no longer runs
    a large vocabulary beside the KV cache
- id: GR-PATCH-019
  scope: backend
  backend_id: ascend
  owner: vllm_gr/platforms/ascend/config_patch.py
  installer: vllm_gr.platforms.ascend.config_patch.apply_engine_core_config_sanitizer and install_ascend_config_filter
  activation: NPU engine configuration and AscendGRWorker construction;
    repair native config caller bindings even when the sanitizer is installed; entrypoint re-asserted on every create_engine_config
    call and initializes the shared EngineCore plan before native construction
  validator_or_test:
  - tests/v1/test_ascend_compat.py::test_ascend_config_filter_preserves_engine_identity_and_gr_config
  - tests/v1/test_ascend_compat.py::test_ascend_config_filter_restores_mapping_on_native_failure
  - tests/v1/test_ascend_compat.py::test_ascend_entry_installs_filter_before_delegating
  - tests/platforms/test_ascend_worker.py::test_ascend_subclass_preserves_initialization_order_and_native_class
  - tests/v1/test_ascend_compat.py::test_config_binding_recheck_preserves_unrelated_overrides
  process_roles:
  - main
  - engine_core
  - worker
  target: vllm.v1.engine.core.EngineCoreProc.run_engine_core and vllm_ascend.ascend_config.init_ascend_config
  risk: high
  contract: ascend-config-additional-config-keys
  removal_condition: vllm-ascend's AscendConfig accepts unknown additional_config keys, or vllm-gr stops carrying
    its configuration in additional_config
- id: GR-PATCH-021
  scope: backend
  backend_id: ascend
  owner: vllm_gr/v1/worker/npu/kv_layout_patch.py
  installer: vllm_gr.v1.worker.npu.kv_layout_patch.apply_npu_contiguous_kv_cache_patch
  activation: AscendGRWorker.init_device before native runner construction; known Ascend 0.30.0rc2 bindings
  validator_or_test:
  - tests/v1/test_npu_kv_layout.py
  - tests/platforms/test_ascend_worker.py::test_ascend_subclass_preserves_initialization_order_and_native_class
  process_roles:
  - npu_worker
  target: vllm_ascend.attention.utils.requires_contiguous_pa_kv_cache and its model_runner_v1 import binding
  risk: high
  contract: npu-contiguous-prefix-kv-allocation
  removal_condition: Ascend exposes a backend contiguous-KV capability covering GR xllm without a native policy
    bridge
retired_patches:
- id: GR-PATCH-006
  historical_target: OpenAIServingModels.__init__
  reason: Legacy Catalog serving patch and its tests were removed; canonical V1 constraints load in the worker
  replacement_coverage:
  - tests/constraints/test_cuda_backend.py::test_canonical_worker_enables_vocab_slice_before_first_forward
  - tests/engine/test_gr_config_transport.py::test_file_snapshot_survives_driver_file_removal
- id: GR-PATCH-014
  historical_target: LMCache RequestTracker, ReqMeta, and LMCacheConnectorV1Impl
  reason: Experimental LMCache integration removed; no supported version pin or vLLM 0.30 validation
  replacement_coverage: []
- id: GR-PATCH-017
  historical_target: NPUWorker.profile_memory in vllm_ascend.worker.worker or vllm_ascend.worker.worker_v1
  reason: Removal condition met by the 0.30 upgrade; vllm-ascend 0.30.0rc2 replaced profile_memory with log_memory_stats,
    which reads the two allocator counters directly, and the installer found no native method to wrap on that runtime
  replacement_coverage: []
- id: GR-PATCH-020
  historical_target: vllm.config.ModelConfig.maybe_untie_word_embeddings
  reason: Model-specific tied-embedding compatibility was retired with its deployment recipe
  replacement_coverage: []
- id: GR-PATCH-002
  target: NPUWorker.init_device
  reason: AscendGRWorker inherits the native Worker and initializes AscendGRModelRunner directly.
