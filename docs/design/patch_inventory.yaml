# Authoritative patch ownership inventory. Independent core/provider assertions
# are checked against it; see docs/design/module/runtime_patches.md for the
# rationale and docs/design/runtime_patch_inventory.md for the checked index.
schema_version: 3

pre_upgrade_baseline:
  vllm: "0.22.1"
  vllm_ascend: "0.22.1rc1"

current_runtime:
  cuda:
    vllm: "0.30.0"
  npu:
    vllm: "0.30.0"
    vllm_ascend: "0.30.0rc2"

patches:
  - id: GR-PATCH-000
    scope: core
    backend_id: null
    owner: vllm_gr/plugin.py
    installer: vllm_gr.plugin.register
    activation: vLLM loads the vllm.general_plugins entry point and the selected provider passes environment checks
    validator_or_test:
      - tests/patch/test_patch_initialization.py::test_plugin_exposes_simple_per_patch_status
      - tests/platforms/test_runtime_wiring.py
      - tests/platforms/test_import_isolation.py::test_cuda_plugin_initialization_does_not_import_ascend
    process_roles: [main, engine_core, worker]
    target: vllm_gr.plugin.register
    risk: high
    contract: plugin-entrypoint
    removal_condition: runtime patch installation is no longer required

  - id: GR-PATCH-001
    scope: core
    backend_id: null
    owner: vllm_gr/v1/attention/selector_patch.py
    installer: vllm_gr.v1.attention.selector_patch.apply_custom_attention_backend_patch
    activation: the vLLM attention selector is importable and the wrapper is not installed
    validator_or_test:
      - tests/v1/test_ascend_compat.py::test_selector_installation_is_idempotent_and_force_uses_original
      - tests/v1/test_ascend_compat.py::test_selector_reinstalls_over_replaced_upstream_target
      - tests/v1/test_ascend_compat.py::test_selector_cache_reset_preserves_installed_callable
      - tests/engine/test_gr_config.py::test_attention_selector_config_reader_propagates_validation_errors
      - tests/integration/test_ascend_attention_backend.py
    process_roles: [engine_core, worker]
    target: vllm.v1.attention.selector._cached_get_attn_backend
    risk: critical
    contract: attention-selector-signature
    removal_condition: upstream preserves and resolves explicit and marker-restored CUSTOM backend intent on every supported platform

  - id: GR-PATCH-002
    scope: backend
    backend_id: ascend
    owner: vllm_gr/v1/worker/npu/startup_patch.py
    installer: vllm_gr.v1.worker.npu.startup_patch.patch_npu_worker_init_device
    activation: the selected NPU provider revalidates early config bindings on every call and wraps NPUWorker.init_device only when needed; unavailable native worker imports are retried on later initialization
    validator_or_test:
      - tests/v1/test_ascend_compat.py::test_npu_worker_patch_is_lazy_and_preserves_lifecycle_contract
      - tests/v1/test_ascend_compat.py::test_npu_worker_reinstalls_over_replaced_upstream_target
      - tests/v1/test_ascend_compat.py::test_worker_rechecks_config_bindings_without_rewrapping_device_hook
    process_roles: [worker]
    target: vllm_ascend.worker.worker.NPUWorker.init_device
    risk: high
    contract: null
    removal_condition: stable NPU worker initialization installs compatibility before ModelRunner construction

  - id: GR-PATCH-003
    scope: core
    backend_id: null
    owner: vllm_gr/v1/engine/logprobs_patch.py
    installer: vllm_gr.v1.engine.logprobs_patch.patch_flat_logprobs
    activation: the required frontend patch plan detects the method is not installed
    validator_or_test:
      - vllm_gr.v1.engine.logprobs_patch.validate_flat_logprobs_patch
      - tests/patch/test_patch_initialization.py::test_flat_logprobs_patch_preserves_offsets_and_optional_columns
    process_roles: [offline_frontend, api_server]
    target: vllm.logprobs.FlatLogprobs.append_fast
    risk: medium
    contract: null
    removal_condition: the GR implementation is no longer needed or is available upstream

  - id: GR-PATCH-004
    scope: core
    backend_id: null
    owner: vllm_gr/entrypoints/openai/serving_engine.py and protocol.py
    installer: vllm_gr.entrypoints.openai.beam_search_patch.patch_beam_search and patch_sampling
    activation: the required frontend patch plan detects a missing serving or sampling binding, or a mismatched Completion vllm_xargs schema
    validator_or_test:
      - vllm_gr.entrypoints.openai.beam_search_patch.validate_openai_beam_search_patch
      - vllm_gr.entrypoints.openai.beam_search_patch.validate_sampling_patch
      - tests/entrypoints/beam_search/test_beam_search_online_entry.py
      - tests/st/test_onerec_v1_scheduler_st.py::test_onerec_v1_completion_batch_online
      - tests/entrypoints/openai/test_beam_search_dispatch.py
    process_roles: [api_server]
    target: GenerateBaseServing.beam_search, ChatCompletionRequest/CompletionRequest.to_beam_search_params, and CompletionRequest.model_fields["vllm_xargs"]
    risk: high
    contract: beam_search adapts upstream callers exclusively to the GR implementation
    removal_condition: upstream exposes grouped-Beam serving and sampling extension points

  - id: GR-PATCH-005
    scope: core
    backend_id: null
    owner: vllm_gr/engine/arg_utils.py
    installer: vllm_gr.engine.arg_utils.patch_add_cli_args
    activation: the required frontend patch plan detects GR EngineArgs methods are not installed; GR defaults and Beam validation activate only for explicit GR engines
    validator_or_test:
      - vllm_gr.engine.arg_utils.validate_engine_args_patch
      - tests/engine/test_backend_plan_engine_args.py
      - tests/v1/attention/test_attention_backend_custom.py
      - tests/engine/test_gr_config_v1.py
    process_roles: [main, api_server]
    target: vllm.engine.arg_utils.EngineArgs
    risk: high
    contract: engine-args-descriptors
    removal_condition: vLLM configuration hooks cover every active GR option

  - id: GR-PATCH-007
    scope: core
    backend_id: null
    owner: vllm_gr/v1/engine/core_client.py, core_client_patch.py, beam_session_client.py, and output_processor.py
    installer: vllm_gr.patch.install_engine_session_hooks
    activation: the required frontend patch plan detects grouped Beam client methods are incomplete
    validator_or_test:
      - vllm_gr.patch._validate_engine_session_hooks
      - tests/v1/beam/test_beam_request_unit.py
      - tests/v1/engine/test_gr_admission_queue.py
      - tests/entrypoints/beam_search/test_beam_search_online_entry.py
      - tests/v1/engine/test_beam_admission_rejection_reporting.py
      - tests/st/test_engine_entrypoint_startup.py
    process_roles: [main, api_server]
    target: EngineCore clients and AsyncLLM
    risk: critical
    contract: null
    removal_condition: vLLM exposes stable grouped request, control-message, and routing hooks

  - id: GR-PATCH-008
    scope: core
    backend_id: null
    owner: vllm_gr/v1/engine/wire.py
    installer: vllm_gr.v1.engine.wire.register_engine_core_request_types
    activation: frontend and EngineCore installers require the GR wire values
    validator_or_test:
      - vllm_gr.v1.engine.wire.validate_request_types_patch
      - tests/contract/test_engine_core_protocol_contracts.py
    process_roles: [api_server, engine_core]
    target: vllm.v1.engine.EngineCoreRequestType
    risk: critical
    contract: engine-wire-values
    removal_condition: stable upstream messages carry grouped Beam operations without Enum mutation

  - id: GR-PATCH-009
    scope: core
    backend_id: null
    owner: vllm_gr/v1/engine/core.py, core_socket.py, engine_core_patch.py, and hot_update.py
    installer: vllm_gr.v1.engine.engine_core_patch.apply_engine_core_request_patches
    activation: the shared EngineCore plan, including the sanitized NPU child entrypoint, detects incomplete request dispatch or Trie-capacity initialization; the constructor also verifies backend plan readiness before accepting requests; the same installer mounts hot-update utilities independently of the optional management listener
    validator_or_test:
      - vllm_gr.v1.engine.engine_core_patch.validate_engine_core_request_group
      - vllm_gr.v1.engine.engine_core_patch.validate_engine_core_entrypoint_patch
      - tests/v1/engine/test_gr_async_scheduler.py
      - tests/constraints/test_npu_multi_trie_routing.py
      - tests/platforms/test_backend_plan.py
      - tests/v1/test_ascend_compat.py
      - tests/contract/test_upstream_patch_contracts.py::test_core_hot_update_utility_contracts
      - tests/sidecar/test_management.py
    process_roles: [engine_core]
    target: vllm.v1.engine.core.EngineCoreProc and EngineCore.service_status/pause/resume/reload_trie
    risk: critical
    contract: engine-core-signatures
    removal_condition: vLLM exposes stable control-message, request-dispatch, and named management utility extension points

  - id: GR-PATCH-010
    scope: core
    backend_id: null
    owner: vllm_gr/v1/core/sched/scheduler_patch.py and beam_async_scheduler.py
    shared_helpers: vllm_gr/v1/core/sched/beam_session.py, vllm_gr/v1/beam/dispatch.py
    installer: vllm_gr.v1.core.sched.scheduler_patch.apply_scheduler_patch
    activation: the EngineCore patch plan detects a missing schedule or update_from_output wrapper
    validator_or_test:
      - vllm_gr.v1.core.sched.scheduler_patch.validate_scheduler_patch
      - tests/v1/engine/test_gr_async_scheduler.py
      - tests/patch/test_patch_initialization.py::test_scheduler_plan_repairs_partial_install
    process_roles: [engine_core]
    target: Scheduler.schedule and Scheduler.update_from_output in vllm.v1.core.sched.scheduler
    risk: critical
    contract: scheduler-contract
    removal_condition: explicit upstream scheduler metadata hooks carry grouped Beam state

  - id: GR-PATCH-022
    scope: core
    backend_id: null
    owner: vllm_gr/v1/core/kv_cache_utils.py
    installer: vllm_gr.v1.core.kv_cache_utils.apply_kv_hash_memo_patch
    activation: the EngineCore plan detects a missing block or chain hash wrapper or a stale EngineCore factory binding
    validator_or_test:
      - vllm_gr.v1.core.kv_cache_utils.validate_kv_hash_memo_patch
      - tests/v1/core/test_gr_plain_hash_chain.py
      - tests/patch/test_patch_initialization.py::test_kv_hash_memo_patch_equivalence_and_hits
      - tests/patch/test_patch_initialization.py::test_kv_hash_memo_plan_repairs_partial_install
    process_roles: [engine_core]
    target: vllm.v1.core.kv_cache_utils.hash_block_tokens and get_request_block_hasher, plus vllm.v1.engine.core.get_request_block_hasher
    risk: high
    contract: prefix-cache-hash-equivalence
    removal_condition: upstream provides equivalent prefix hashing for repeated prompts

  - id: GR-PATCH-011
    scope: backend
    backend_id: cuda
    owner: vllm_gr/v1/worker/cuda/runner_installer.py, vllm_gr/v1/worker/cuda/v1/gpu_model_runner_patch.py and vllm_gr/v1/worker/cuda/v2/gpu_model_runner_v2_patch.py
    shared_helpers: vllm_gr/v1/worker/model_runner_common.py, vllm_gr/v1/worker/model_runner_contracts.py, vllm_gr/v1/worker/gr_gc.py, vllm_gr/v1/worker/gr_context.py, vllm_gr/v1/worker/gr_execution.py, vllm_gr/v1/worker/cuda/gpu_postprocess_workspace.py, vllm_gr/v1/worker/cuda/v2/gpu_model_runner_v2_resources.py, vllm_gr/v1/worker/cuda/v1/gpu_prefill_inputs.py, vllm_gr/v1/worker/cuda/v2/gpu_prefill_v2.py, vllm_gr/v1/worker/hot_update.py, vllm_gr/constraints/versioned_table.py, vllm_gr/v1/worker/cuda/gpu_stage_hooks.py, vllm_gr/v1/worker/cuda/gpu_beam_stage_runner.py, vllm_gr/v1/worker/cuda/v1/gpu_beam_stage_runner_v1.py, vllm_gr/v1/worker/cuda/v2/gpu_beam_stage_runner_v2.py
    installer: vllm_gr.v1.worker.model_runner_patch.apply_worker_patches
    activation: the CUDA provider mounts Worker utilities at process startup; Worker.init_device installs and verifies the admitted V1 or V2 generation, which binds the planned runner after model load regardless of the management listener; V2 prepares stage Top-K variants before initial or replacement table publication; V2 Prefill fast paths require admitted pure GR batches; fused state writes additionally require fresh complete prompts, empty request state and no pending writes
    binding_validation: first bind and full reload retain the admitted plan across positive native max_model_len reductions within its limit; provider validation sees the live fitted config and other drift fails before service creation
    validator_or_test:
      - vllm_gr.v1.worker.model_runner_patch.validate_model_runner_patch
      - tests/platforms/test_runner_lifecycle.py::test_first_load_binds_admitted_plan_after_native_autofit
      - tests/platforms/test_runner_lifecycle.py::test_full_reload_rebinds_admitted_plan_after_native_autofit
      - tests/platforms/test_runner_lifecycle.py::test_autofit_does_not_hide_worker_plan_drift
      - tests/v1/worker/test_gpu_model_runner_patch.py
      - tests/v1/worker/test_gpu_postprocess_workspace.py
      - tests/v1/beam/test_beam_postprocess_workspace.py
      - tests/platforms/test_import_isolation.py
      - tests/kernels/test_beam_batch_switch_reuse.py
      - tests/v1/worker/test_gpu_model_runner_v2_patch.py
      - tests/v1/worker/test_v2_runtime_resources.py
      - tests/kernels/test_gpu_beam_stage_lifecycle.py
      - tests/kernels/test_gr_prefill_v2.py
      - tests/kernels/test_v2_multibatch_graphs.py
      - tests/kernels/test_beam_pool_recapture.py
      - tests/v1/worker/test_model_runner_patch.py
      - tests/v1/worker/test_model_runner_patch.py::test_active_cuda_worker_hot_update_utility_contract
      - tests/sidecar/test_worker_update.py
      - tests/v1/worker/test_constraint_lifecycle.py
      - tests/v1/worker/test_model_runner_stage_binding.py
      - tests/v1/worker/test_cuda_native_output.py
      - tests/v1/worker/test_v2_multibatch.py
      - tests/kernels/test_gpu_beam_stage_v2_state.py
      - tests/v1/worker/test_gr_startup.py
      - tests/tools/test_cuda_stage_typing.py
      - tests/st/test_modelrunner_v2_stage_parity_st.py
    process_roles: [gpu_worker]
    target: vllm.v1.worker.gpu_model_runner.GPUModelRunner, vllm.v1.worker.gpu.model_runner.GPUModelRunner, vllm.v1.worker.gpu_worker.Worker.init_device, and vllm.v1.worker.gpu_worker.Worker.reload_trie
    risk: critical
    contract: gpu-model-runner-signatures
    removal_condition: stable upstream grouped input/output, Worker utility, and constraint-backend lifecycle hooks replace private runner mutation

  - id: GR-PATCH-012
    scope: backend
    backend_id: ascend
    owner: vllm_gr/v1/worker/npu/npu_model_runner_patch.py, vllm_gr/v1/worker/npu/stage_projection.py
    shared_helpers: vllm_gr/v1/worker/model_runner_common.py, vllm_gr/v1/worker/npu/npu_model_runner_inputs.py, vllm_gr/v1/worker/model_runner_contracts.py, vllm_gr/v1/worker/gr_gc.py, vllm_gr/v1/worker/gr_context.py, vllm_gr/v1/worker/gr_execution.py, vllm_gr/v1/worker/hot_update.py, vllm_gr/constraints/versioned_table.py, vllm_gr/ops/npu/stage_projection.py, vllm_gr/v1/worker/npu/startup_patch.py
    installer: vllm_gr.v1.worker.model_runner_patch.apply_worker_patches
    activation: the Ascend provider discovers NPUModelRunner and binds its planned lifecycle after model load; the delayed NPUWorker.init_device wrapper mounts common Worker utilities before native initialization, independently of the management listener; online Trie reload remains rejected by Core on NPU
    binding_validation: uses the same admitted-plan and native max_model_len autofit checks as GR-PATCH-011
    validator_or_test:
      - vllm_gr.v1.worker.model_runner_patch.validate_model_runner_patch
      - tests/platforms/test_runner_lifecycle.py::test_first_load_binds_admitted_plan_after_native_autofit
      - tests/platforms/test_runner_lifecycle.py::test_full_reload_rebinds_admitted_plan_after_native_autofit
      - tests/platforms/test_runner_lifecycle.py::test_autofit_does_not_hide_worker_plan_drift
      - tests/v1/worker/test_npu_model_runner_patch.py
      - tests/v1/worker/test_model_runner_patch.py
      - tests/v1/worker/test_npu_prefill_bsnd.py
      - tests/v1/worker/test_prefill_graph_runner.py
      - tests/v1/test_ascend_compat.py::test_npu_worker_patch_is_lazy_and_preserves_lifecycle_contract
      - tests/sidecar/test_management.py::test_trie_rejects_unsupported_execution_before_worker_rpc
      - tests/sidecar/test_worker_update.py
      - tests/ops/test_npu_stage_logits.py
      - tests/v1/worker/test_npu_stage_projection_lifecycle.py
    process_roles: [npu_worker]
    target: >-
      NPUModelRunner execute_model, _prepare_inputs, sample_tokens and graph/lifecycle hooks,
      and NPUWorker.reload_trie (native _sample and _bookkeeping_sync unchanged).
      Stage projection wraps the instance LogitsProcessor._get_logits, NPUModelRunner.reload_weights,
      and NPUWorker start_weight_update, update_weights, and finish_weight_update.
    risk: critical
    contract: docs/design/feature/npu_decode_execution.md
    removal_condition: vLLM-Ascend exposes stable grouped input/output, Worker utility, and constraint-backend lifecycle hooks

  - id: GR-PATCH-013
    scope: core
    backend_id: null
    owner: vllm_gr/v1/attention/backends/beam_attn.py
    execution: Beam attention layers use the executor published by their runner binding
    installer: vllm_gr.v1.attention.backends.beam_attn register_backend decorator
    activation: the facade module is imported and CUSTOM is selected for GR Beam Attention
    validator_or_test:
      - tests/v1/attention/test_beam_attention_platform_execution.py
      - tests/v1/attention/test_beam_attention_metadata.py
      - tests/v1/attention/test_attention_backend_custom.py
    process_roles: [engine_core, worker]
    target: vllm.v1.attention.backends.registry.AttentionBackendEnum.CUSTOM
    risk: high
    contract: custom-attention-registry
    ownership:
      metadata_builder: vllm_gr.v1.attention.backends.beam_attn_metadata
      gpu_execution: vllm_gr.v1.attention.backends.beam_attn_gpu
      npu_execution: vllm_gr.v1.attention.backends.beam_attn_npu
      backend_registration_and_facade: vllm_gr.v1.attention.backends.beam_attn
      compatibility_exports:
        - BeamAttentionMetadata
        - BeamAttentionMetadataBuilder
        - BEAM_DATA_VAR
    removal_condition: vLLM supports named third-party backend identities without a shared CUSTOM slot

  - id: GR-PATCH-015
    scope: core
    backend_id: null
    owner: vllm_gr/v1/worker/sliced_logits_patch.py
    shared_helpers: vllm_gr/ops/sliced_logits.py, vllm_gr/v1/worker/lm_head_cache.py
    installer: vllm_gr.v1.worker.sliced_logits_patch.apply_sliced_logits_patch
    activation: projection uses the token window on the model's LogitsProcessor; cache reload hooks install after model load by ParallelLMHead type, independent of module names
    validator_or_test:
      - tests/ops/test_sliced_logits.py
      - tests/platforms/test_import_isolation.py::test_cuda_plugin_initialization_does_not_import_ascend
      - tests/sidecar/test_worker_update.py::test_sliced_cache_survives_native_layerwise_reload
      - tests/patch/test_patch_initialization.py::test_optional_patch_count_tracks_actual_installation
    process_roles: [worker]
    target: LogitsProcessor._get_logits, Sampler.gather_logprobs, V2 compute_topk_scores, and quant_method.process_weights_after_loading for dense ParallelLMHead weights and tied owners
    risk: medium
    contract: sliced-vocabulary-projection
    removal_condition: vLLM exposes stable output-projection and logprob-width hooks

  - id: GR-PATCH-016
    scope: backend
    backend_id: ascend
    owner: vllm_gr/platforms/ascend/spawn_patch.py
    installer: vllm_gr.platforms.ascend.spawn_patch.apply_npu_spawn_patch
    activation: the selected NPU provider installs or repairs spawn protection before importing the native worker
    validator_or_test:
      - tests/patch/test_patch_initialization.py::test_npu_spawn_patch_wraps_upstream_force_spawn_and_both_bindings
      - tests/patch/test_patch_initialization.py::test_npu_spawn_patch_forces_spawn_only_when_npu_initialized
    process_roles: [main, engine_core]
    target: vllm.utils.system_utils._maybe_force_spawn
    risk: medium
    contract: npu-spawn-start-method
    removal_condition: upstream _maybe_force_spawn() covers NPU (or delegates to the platform interface)

  - id: GR-PATCH-018
    scope: backend
    backend_id: ascend
    owner: vllm_gr/v1/worker/npu/startup_patch.py
    installer: vllm_gr.v1.worker.npu.startup_patch.apply_penalties_warmup_oom_guard
    activation: NPUWorker init_device runs in the child process and the native penalties warmup callable is present
    validator_or_test: []  # No behavioural test yet; the native callable guard runs at install time.
    process_roles: [npu_worker]
    target: vllm_ascend.model_executor.warmup.kernel_warmup.penalties_triton_warmup
    risk: medium
    contract: npu-penalties-warmup-oom
    removal_condition: vllm-ascend sizes the warmup dummies from the available NPU budget, or vllm-gr no longer runs a large vocabulary beside the KV cache

  - id: GR-PATCH-019
    scope: backend
    backend_id: ascend
    owner: vllm_gr/platforms/ascend/config_patch.py
    installer: vllm_gr.platforms.ascend.config_patch.apply_engine_core_config_sanitizer and install_ascend_config_filter
    activation: NPU engine configuration and every worker plugin initialization, independently of the device hook; repair native config caller bindings even when the sanitizer is installed; entrypoint re-asserted on every create_engine_config call and initializes the shared EngineCore plan before native construction
    validator_or_test:
      - tests/v1/test_ascend_compat.py::test_ascend_config_filter_preserves_engine_identity_and_gr_config
      - tests/v1/test_ascend_compat.py::test_ascend_config_filter_restores_mapping_on_native_failure
      - tests/v1/test_ascend_compat.py::test_ascend_entry_installs_filter_before_delegating
      - tests/v1/test_ascend_compat.py::test_worker_installs_config_filter_before_constructor
      - tests/v1/test_ascend_compat.py::test_worker_rechecks_config_bindings_without_rewrapping_device_hook
      - tests/v1/test_ascend_compat.py::test_config_binding_recheck_preserves_unrelated_overrides
    process_roles: [main, engine_core, worker]
    target: vllm.v1.engine.core.EngineCoreProc.run_engine_core and vllm_ascend.ascend_config.init_ascend_config
    risk: high
    contract: ascend-config-additional-config-keys
    removal_condition: vllm-ascend's AscendConfig accepts unknown additional_config keys, or vllm-gr stops carrying its configuration in additional_config

  - id: GR-PATCH-021
    scope: backend
    backend_id: ascend
    owner: vllm_gr/v1/worker/npu/kv_layout_patch.py
    installer: vllm_gr.v1.worker.npu.kv_layout_patch.apply_npu_contiguous_kv_cache_patch
    activation: NPUWorker init_device before native runner construction; known Ascend 0.30.0rc2 bindings
    validator_or_test:
      - tests/v1/test_npu_kv_layout.py
      - tests/v1/test_ascend_compat.py::test_npu_worker_patch_is_lazy_and_preserves_lifecycle_contract
    process_roles: [npu_worker]
    target: vllm_ascend.attention.utils.requires_contiguous_pa_kv_cache and its model_runner_v1 import binding
    risk: high
    contract: npu-contiguous-prefix-kv-allocation
    removal_condition: Ascend exposes a backend contiguous-KV capability covering GR xllm without a native policy bridge

